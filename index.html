<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busch Apple — Salary & Trade Tool</title>
<style>
  :root{
    --ink:#0a0e14; --panel:#111823; --panel2:#0d131c; --line:#1e2836;
    --txt:#e6ebf2; --mut:#8b97a7; --accent:#4aa8ff; --grn:#33e08a; --red:#ff6060; --gold:#ffcf3f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--txt);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;line-height:1.4}
  .wrap{max-width:1120px;margin:0 auto;padding:0 14px 60px}
  header{padding:20px 0 8px}
  h1{font-size:21px;font-weight:800;margin:0}
  .sub{color:var(--mut);font-size:13px;margin-top:4px}
  .capnote{color:var(--mut);font-size:12px;margin-top:6px}
  .capnote b{color:var(--txt)}

  .tabs{display:flex;gap:8px;margin:16px 0 16px;flex-wrap:wrap}
  .tab{padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:var(--panel);
       color:var(--mut);font-weight:700;font-size:13px;cursor:pointer;user-select:none}
  .tab.active{color:var(--txt);border-color:var(--accent);background:rgba(74,168,255,.08)}

  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .btn{padding:7px 13px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
       color:var(--txt);font-weight:700;font-size:12.5px;cursor:pointer}
  .btn:hover{border-color:var(--mut)}
  .btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .status{color:var(--mut);font-size:12px}

  .loading{color:var(--mut);padding:40px 0;text-align:center}
  .err{color:var(--red);border:1px solid var(--red);border-radius:9px;padding:12px;margin:10px 0;font-size:13px}

  /* player image chain: headshot -> team logo -> initial */
  .pimg-wrap{width:30px;height:30px;flex:0 0 30px;display:inline-flex;align-items:center;justify-content:center}
  .pimg{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top center;background:var(--panel2);display:block}
  .pimg.is-logo{object-fit:contain;background:#fff;padding:3px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
  .pimg-fb{width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;
           font-size:13px;font-weight:800;background:var(--panel2);border:1px solid var(--line)}
  .pos-QB{color:#f0913e}.pos-RB{color:#33e08a}.pos-WR{color:#4aa8ff}.pos-TE{color:#b878ff}
  .pos-K{color:#95a5a6}.pos-DEF{color:#ff6060}.pos-DL{color:#e0679a}.pos-LB{color:#67c7e0}.pos-DB{color:#c7e067}

  /* splash / team picker */
  .splash-h{font-size:15px;font-weight:800;margin:6px 0 10px}
  .picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .pcard{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
         border-radius:11px;background:var(--panel);cursor:pointer;user-select:none;transition:border-color .12s}
  .pcard:hover{border-color:var(--mut)}
  .pcard.sel{border-color:var(--accent);background:rgba(74,168,255,.10)}
  .pcard .oav{width:34px;height:34px;flex:0 0 34px;border-radius:50%;object-fit:cover;background:var(--panel2)}
  .pcard .ometa{min-width:0}
  .pcard .oname{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .osub{color:var(--mut);font-size:11.5px;font-variant-numeric:tabular-nums}
  .picker-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .sel-count{color:var(--mut);font-size:12px}

  /* team columns */
  .cols{display:grid;gap:12px}
  .cols.n1{grid-template-columns:1fr}
  .cols.n2{grid-template-columns:repeat(2,1fr)}
  .cols.n3{grid-template-columns:repeat(3,1fr)}
  .cols.n4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:900px){.cols.n3,.cols.n4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:620px){.cols.n2,.cols.n3,.cols.n4{grid-template-columns:1fr}}

  .team{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
  .team-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
  .team-head .oav{width:32px;height:32px;flex:0 0 32px;border-radius:50%;object-fit:cover;background:var(--panel2)}
  .team-name{font-weight:800;font-size:15px;min-width:0}
  .team-name .sn{color:var(--mut);font-weight:600;font-size:12px;display:block}
  .team-fin{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .team-total{font-weight:800;font-size:15px}
  .team-total .cap{color:var(--mut);font-weight:600;font-size:12px}
  .team-room{font-size:12px;font-weight:700}
  .room-ok{color:var(--grn)} .room-over{color:var(--red)}
  .capbar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:0 14px}
  .capbar .fill{height:100%;background:var(--accent)}
  .capbar .fill.over{background:var(--red)}

  .ctrls{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 4px}
  .ctrls select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:7px;
                padding:5px 8px;font-size:12px;font-weight:700;cursor:pointer;max-width:140px}
  .ctrls select:focus{outline:none;border-color:var(--accent)}

  .roster{padding:6px 14px 12px}
  .prow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;
        padding:5px 0;border-top:1px solid var(--line);font-size:13px}
  .prow:first-child{border-top:none}
  .pname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .ppos{color:var(--mut);font-size:11px;font-weight:700;margin-left:6px}
  .psal{font-weight:800;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}

  /* trade builder */
  .trade-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.trade-grid{grid-template-columns:1fr}}
  .side{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px}
  .side h3{margin:0 0 10px;font-size:14px;font-weight:800}
  select.teamsel,input.psearch{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);
                 border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;margin-bottom:8px}
  input.psearch{font-weight:500}
  input.psearch:focus,select.teamsel:focus{outline:none;border-color:var(--accent)}
  .side .ctrls{padding:0 0 8px}
  .picklist{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px}
  .pick{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px}
  .pick:hover{background:var(--panel2)}
  .pick input{accent-color:var(--accent);cursor:pointer;flex:0 0 auto}
  .pick .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .pick .amt{font-weight:800;font-variant-numeric:tabular-nums;color:var(--mut);flex:0 0 auto}
  .pick.sel .amt{color:var(--txt)}

  .result{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px;margin-top:14px}
  .rcols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:620px){.rcols{grid-template-columns:1fr;gap:14px}}
  .rline{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;font-size:14px;border-top:1px solid var(--line)}
  .rline:first-child{border-top:none}
  .rline .lab{color:var(--mut)}
  .rline .val{font-weight:800;font-variant-numeric:tabular-nums}
  .rbig{font-size:15px;font-weight:800}
  .verdict{margin-top:12px;padding:12px;border-radius:9px;font-weight:800;font-size:14px;text-align:center}
  .verdict.ok{background:rgba(51,224,138,.10);color:var(--grn);border:1px solid var(--grn)}
  .verdict.bad{background:rgba(255,96,96,.10);color:var(--red);border:1px solid var(--red)}
  .swap-note{color:var(--mut);font-size:11.5px;margin-top:8px;text-align:center}
  .foot{color:var(--mut);font-size:11.5px;margin-top:26px;text-align:center;line-height:1.6}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Busch Apple — Salary & Trade Tool</h1>
    <div class="sub" id="sub">Loading live salaries from Sleeper…</div>
    <div class="capnote">Cap per team: <b id="capLabel">$365</b> · salaries pulled live from Sleeper on each load. Honest calculator, no fair/unfair verdict.</div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="table">Teams</div>
    <div class="tab" data-tab="trade">Trade Builder</div>
  </div>

  <div class="bar">
    <button class="btn primary" id="refreshBtn">↻ Refresh</button>
    <span class="status" id="status"></span>
    <label class="status" style="margin-left:auto"><input type="checkbox" id="autoRefresh"> auto-refresh 60s</label>
  </div>

  <div id="errbox"></div>

  <div id="pane-table"><div class="loading">Loading…</div></div>
  <div id="pane-trade" class="hide"><div class="loading">Loading…</div></div>

  <div class="foot" id="foot"></div>
</div>

<script>
/* =============================================================================
   Busch Apple Salary & Trade Tool — standalone, public Sleeper API only.
   v2: splash + 1-4 team multi-select, player images, per-team sort/filter,
   source badge removed (salary $ kept). Resolver dollar logic unchanged from v1
   (auction -> FAAB bid -> rookie scale -> $1 floor), verified against the audit.
   Cap is a CONFIG value (365 now, flip to 515 when the vote passes).
   ============================================================================= */

// ---- CONFIG ----
const CAP = 365;                    // <-- one-line flip to 515 when the $515 vote passes
const LEAGUE_ID = "1372256037666574336";
const SEASON = "2026";
const API = "https://api.sleeper.app/v1";
// v2 cache key: slim dict now also carries espn_id + team (for images) -> bump so stale v1 caches refresh
const PLAYERS_KEY = "busch_players_nfl_v2", PLAYERS_TS = "busch_players_nfl_ts_v2", PLAYERS_TTL = 1000*60*60*24;

const ROOKIE_SCALE = {
  "1.01":10,"1.02":10,"1.03":9,"1.04":9,"1.05":9,"1.06":8,"1.07":8,"1.08":8,"1.09":7,"1.10":7,
  "2.01":7,"2.02":6,"2.03":6,"2.04":6,"2.05":5,"2.06":5,"2.07":5,"2.08":4,"2.09":4,"2.10":4,
  "3.01":3,"3.02":3,"3.03":3,"3.04":2,"3.05":2,"3.06":2,"3.07":1,"3.08":1,"3.09":1,"3.10":1
};
const OWNER = {
  rearmostzeus:"Zach", Nyquilbandit:"Henry", Sdljunce:"Seth", ChayDyck:"Chay", RileyHeid13:"Riley",
  JunceBoxes:"Nick", charliehorejsi:"Charlie", TheZynBandit:"Bobby", DaBigDyck:"Ajay", BigBomboclaat69:"Jonah"
};
const POS_ORDER = ["QB","RB","WR","TE","K","DEF","DL","LB","DB"];

// ---- state ----
let TEAMS = [];          // [{roster_id, owner, sn, avatar, players:[{pid,name,pos,amt,espnId,team}], total, room}]
let PLAYERS = null;
let AUTO = null;
let ACTIVE_TAB = "table";
const SELECTED = new Set();                 // roster_ids selected on the splash (empty = splash view)
const SORT = {};                            // per roster_id: 'sal' | 'pos' | 'name'
const FILTER = {};                          // per roster_id: 'ALL' | position
const TRADE = { A:{teamIdx:null, sel:new Set(), q:"", fpos:"ALL"}, B:{teamIdx:null, sel:new Set(), q:"", fpos:"ALL"} };

async function j(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error(`${r.status} ${url.split("/v1/")[1]||url}`); return r.json(); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---- player images (headshot -> team logo -> position initial) ----
function headshotUrl(espnId){ return `https://a.espncdn.com/i/headshots/nfl/players/full/${espnId}.png`; }
function teamLogoUrl(team){ return `https://a.espncdn.com/i/teamlogos/nfl/500/scoreboard/${String(team).toLowerCase()}.png`; }
function playerImg(p){
  const initial = esc((String(p.name||"?").trim()[0]||"?").toUpperCase());
  const team = (p.team||"").toUpperCase();
  const pos = esc(p.pos||"");
  const fb = `<span class="pimg-fb pos-${pos}" style="display:none">${initial}</span>`;
  const toLogoOrInitial = team
    ? `onerror="this.onerror=null;this.src='${teamLogoUrl(team)}';this.classList.add('is-logo');this.addEventListener('error',function(){this.style.display='none';var s=this.parentNode.querySelector('.pimg-fb');if(s)s.style.display='inline-flex';},{once:true});"`
    : `onerror="this.onerror=null;this.style.display='none';var s=this.parentNode.querySelector('.pimg-fb');if(s)s.style.display='inline-flex';"`;
  if(p.espnId){
    return `<span class="pimg-wrap"><img class="pimg" src="${headshotUrl(p.espnId)}" alt="" loading="lazy" ${toLogoOrInitial}>${fb}</span>`;
  }
  if(team){
    return `<span class="pimg-wrap"><img class="pimg is-logo" src="${teamLogoUrl(team)}" alt="" loading="lazy" onerror="this.onerror=null;this.style.display='none';var s=this.parentNode.querySelector('.pimg-fb');if(s)s.style.display='inline-flex';">${fb}</span>`;
  }
  return `<span class="pimg-wrap"><span class="pimg-fb pos-${pos}" style="display:inline-flex">${initial}</span></span>`;
}

// ---- load the (big) player dictionary, cached 24h. Now keeps espn_id + team for images. ----
async function loadPlayers(){
  try{
    const ts = +(localStorage.getItem(PLAYERS_TS)||0), cached = localStorage.getItem(PLAYERS_KEY);
    if(cached && (Date.now()-ts) < PLAYERS_TTL) return JSON.parse(cached);
  }catch(e){}
  const all = await j(`${API}/players/nfl`);
  const slim = {};
  for(const id in all){ const p = all[id]; if(!p) continue;
    slim[id] = { n: p.full_name || `${p.first_name||""} ${p.last_name||""}`.trim() || id,
                 pos: p.position || "?", e: p.espn_id || "", t: p.team || "" }; }
  try{ localStorage.setItem(PLAYERS_KEY, JSON.stringify(slim)); localStorage.setItem(PLAYERS_TS, String(Date.now())); }catch(e){}
  return slim;
}

// ---- build the salary maps from live Sleeper data (dollar logic identical to v1) ----
async function buildSalaries(){
  const [rosters, users, drafts, players] = await Promise.all([
    j(`${API}/league/${LEAGUE_ID}/rosters`),
    j(`${API}/league/${LEAGUE_ID}/users`),
    j(`${API}/league/${LEAGUE_ID}/drafts`),
    loadPlayers(),
  ]);
  PLAYERS = players;
  const uById = {}; users.forEach(u => uById[u.user_id] = u);

  const auc = {};
  const auctions = drafts.filter(d => d.type === "auction").sort((a,b) => (a.start_time||0) - (b.start_time||0));
  for(const d of auctions){
    const picks = await j(`${API}/draft/${d.draft_id}/picks`);
    for(const p of picks){ const a = p.metadata && p.metadata.amount; if(p.player_id != null && a != null) auc[String(p.player_id)] = Number(a); }
  }
  const rook = {};
  for(const d of drafts.filter(d => d.type !== "auction")){
    const picks = await j(`${API}/draft/${d.draft_id}/picks`);
    for(const p of picks){ const s = `${p.round}.${String(p.draft_slot).padStart(2,"0")}`; if(p.player_id != null && ROOKIE_SCALE[s] != null) rook[String(p.player_id)] = ROOKIE_SCALE[s]; }
  }
  const faab = {};
  for(let wk=1; wk<=18; wk++){
    let txns = [];
    try{ txns = await j(`${API}/league/${LEAGUE_ID}/transactions/${wk}`); }catch(e){ continue; }
    for(const x of (txns||[])){
      if(x.status !== "complete") continue;
      const bid = x.settings && x.settings.waiver_bid;
      if(x.adds && bid != null) for(const pid of Object.keys(x.adds)) faab[pid] = Number(bid);
    }
  }

  // resolver (dollar priority unchanged): auction -> FAAB bid -> rookie scale -> $1 floor
  function sal(pid){ pid = String(pid);
    if(auc[pid] != null) return auc[pid];
    if(faab[pid] != null) return faab[pid];
    if(rook[pid] != null) return rook[pid];
    return 1;
  }
  const P = pid => PLAYERS[pid] || null;

  const teams = rosters.map(r => {
    const u = uById[r.owner_id] || {};
    const sn = u.display_name || u.username || "?";
    const owner = OWNER[sn] || sn;
    const avatar = u.avatar ? `https://sleepercdn.com/avatars/thumbs/${u.avatar}` : null;
    const ps = (r.players||[]).map(pid => {
      const p = P(pid);
      return { pid: String(pid), name: p?p.n:`id ${pid}`, pos: p?p.pos:"?", espnId: p?p.e:"", team: p?p.t:"", amt: sal(pid) };
    });
    const total = ps.reduce((s,p) => s + p.amt, 0);
    return { roster_id: r.roster_id, owner, sn, avatar, players: ps, total, room: CAP - total };
  }).sort((a,b) => b.total - a.total);

  return teams;
}

// ---- sorting / filtering a team's players ----
function sortedFilteredPlayers(t){
  const mode = SORT[t.roster_id] || "sal";
  const fpos = FILTER[t.roster_id] || "ALL";
  let ps = t.players.slice();
  if(fpos !== "ALL") ps = ps.filter(p => p.pos === fpos);
  ps.sort((a,b) => {
    if(mode === "name") return a.name.localeCompare(b.name);
    if(mode === "pos")  return (POS_ORDER.indexOf(a.pos) - POS_ORDER.indexOf(b.pos)) || (b.amt - a.amt) || a.name.localeCompare(b.name);
    return (b.amt - a.amt) || a.name.localeCompare(b.name); // salary default
  });
  return ps;
}
function teamPositions(t){
  const present = new Set(t.players.map(p => p.pos).filter(Boolean));
  const known = POS_ORDER.filter(p => present.has(p));
  const extra = [...present].filter(p => !POS_ORDER.includes(p)).sort();
  return known.concat(extra);
}

// ---- render one team card (used by splash view + show-all) ----
function teamCard(t){
  const overCap = t.total > CAP;
  const pct = Math.min(100, Math.round(t.total / CAP * 100));
  const roomCls = t.room < 0 ? "room-over" : "room-ok";
  const roomTxt = t.room < 0 ? `$${Math.abs(t.room)} over` : `$${t.room} room`;
  const sortMode = SORT[t.roster_id] || "sal";
  const fpos = FILTER[t.roster_id] || "ALL";
  const posOpts = [`<option value="ALL"${fpos==="ALL"?" selected":""}>All pos</option>`]
    .concat(teamPositions(t).map(p => `<option value="${esc(p)}"${fpos===p?" selected":""}>${esc(p)}</option>`)).join("");
  const sortOpts = [["sal","Salary"],["pos","Position"],["name","Name"]]
    .map(([v,l]) => `<option value="${v}"${sortMode===v?" selected":""}>${l}</option>`).join("");
  const ps = sortedFilteredPlayers(t);
  const av = t.avatar ? `<img class="oav" src="${t.avatar}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span class="oav"></span>`;

  return `<div class="team">
    <div class="team-head">
      ${av}
      <div class="team-name">${esc(t.owner)}<span class="sn">@${esc(t.sn)}</span></div>
      <div class="team-fin">
        <div class="team-total">$${t.total}<span class="cap"> / ${CAP}</span></div>
        <div class="team-room ${roomCls}">${roomTxt}</div>
      </div>
    </div>
    <div class="capbar"><div class="fill ${overCap?'over':''}" style="width:${pct}%"></div></div>
    <div class="ctrls">
      <select data-sort="${t.roster_id}">${sortOpts}</select>
      <select data-filter="${t.roster_id}">${posOpts}</select>
    </div>
    <div class="roster">
      ${ps.length ? ps.map(p => `<div class="prow">
        ${playerImg(p)}
        <span class="pname">${esc(p.name)}<span class="ppos">${esc(p.pos)}</span></span>
        <span class="psal">$${p.amt}</span>
      </div>`).join("") : `<div class="status" style="padding:8px 0">No players at this position.</div>`}
    </div>
  </div>`;
}

function wireTeamControls(scope){
  scope.querySelectorAll("select[data-sort]").forEach(sel => sel.addEventListener("change", e => {
    SORT[Number(e.target.dataset.sort)] = e.target.value; paintTable();
  }));
  scope.querySelectorAll("select[data-filter]").forEach(sel => sel.addEventListener("change", e => {
    FILTER[Number(e.target.dataset.filter)] = e.target.value; paintTable();
  }));
}

// ---- render: Teams tab (splash picker + selected columns, or all-10) ----
function paintTable(){
  const el = document.getElementById("pane-table");
  if(!TEAMS.length){ el.innerHTML = `<div class="loading">No teams.</div>`; return; }

  // team picker (always shown at top)
  const picker = `<div class="splash-h">Pick 1–4 teams to view side by side, or show all.</div>
    <div class="picker">` + TEAMS.map(t => {
      const av = t.avatar ? `<img class="oav" src="${t.avatar}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span class="oav"></span>`;
      const sel = SELECTED.has(t.roster_id) ? " sel" : "";
      return `<div class="pcard${sel}" data-pick="${t.roster_id}">
        ${av}<div class="ometa"><div class="oname">${esc(t.owner)}</div>
        <div class="osub">$${t.total} / ${CAP}</div></div>
      </div>`;
    }).join("") + `</div>
    <div class="picker-actions">
      <button class="btn sm" id="showAllBtn">Show all 10</button>
      <button class="btn sm" id="clearSelBtn">Clear</button>
      <span class="sel-count" id="selCount"></span>
    </div>`;

  // which teams to render as columns
  let shown, nCol;
  if(SELECTED.size === 0){
    shown = []; // splash only, no columns yet
  } else {
    shown = TEAMS.filter(t => SELECTED.has(t.roster_id));
    nCol = Math.min(4, shown.length);
  }
  const showAllMode = SELECTED.has("__ALL__");
  if(showAllMode){ shown = TEAMS.slice(); nCol = 4; }

  let cols;
  if(!shown.length){
    cols = `<div class="status" style="padding:20px 0;text-align:center">Select a team above to see its roster and salaries.</div>`;
  } else {
    cols = `<div class="cols n${nCol}">` + shown.map(teamCard).join("") + `</div>`;
  }

  el.innerHTML = picker + cols;

  // wire picker
  el.querySelectorAll("[data-pick]").forEach(c => c.addEventListener("click", () => {
    SELECTED.delete("__ALL__");
    const id = Number(c.dataset.pick);
    if(SELECTED.has(id)) SELECTED.delete(id);
    else { if(SELECTED.size >= 4){ /* cap at 4: drop the oldest */ const first = SELECTED.values().next().value; SELECTED.delete(first); } SELECTED.add(id); }
    paintTable();
  }));
  const showAll = el.querySelector("#showAllBtn"); if(showAll) showAll.addEventListener("click", () => { SELECTED.clear(); SELECTED.add("__ALL__"); paintTable(); });
  const clearSel = el.querySelector("#clearSelBtn"); if(clearSel) clearSel.addEventListener("click", () => { SELECTED.clear(); paintTable(); });
  const cnt = el.querySelector("#selCount");
  if(cnt) cnt.textContent = showAllMode ? "showing all 10" : SELECTED.size ? `${SELECTED.size} selected (max 4)` : "none selected";
  wireTeamControls(el);
}

// ---- render: Trade Builder ----
function paintTrade(){
  const el = document.getElementById("pane-trade");
  if(!TEAMS.length){ el.innerHTML = `<div class="loading">No teams.</div>`; return; }

  function sidePanel(sideKey, label){
    const st = TRADE[sideKey];
    const teamOpts = `<option value="">— pick a team —</option>` + TEAMS.map((t,i) =>
      `<option value="${i}" ${st.teamIdx===i?"selected":""}>${esc(t.owner)} ($${t.total})</option>`).join("");
    let body = `<div class="status">Select a team to see its roster.</div>`;
    if(st.teamIdx != null && TEAMS[st.teamIdx]){
      const t = TEAMS[st.teamIdx];
      const posList = teamPositions(t);
      const fposOpts = [`<option value="ALL"${st.fpos==="ALL"?" selected":""}>All pos</option>`]
        .concat(posList.map(p => `<option value="${esc(p)}"${st.fpos===p?" selected":""}>${esc(p)}</option>`)).join("");
      const q = (st.q||"").toLowerCase();
      let ps = t.players.slice().sort((a,b) => b.amt - a.amt || a.name.localeCompare(b.name));
      if(st.fpos !== "ALL") ps = ps.filter(p => p.pos === st.fpos);
      if(q) ps = ps.filter(p => p.name.toLowerCase().includes(q));
      body = `<input class="psearch" type="search" placeholder="Search players…" data-side="${sideKey}" value="${esc(st.q||"")}">
        <div class="ctrls"><select data-tfilter="${sideKey}">${fposOpts}</select></div>
        <div class="picklist">` + (ps.length ? ps.map(p =>
          `<label class="pick ${st.sel.has(p.pid)?'sel':''}">
            <input type="checkbox" data-side="${sideKey}" data-pid="${p.pid}" ${st.sel.has(p.pid)?"checked":""}>
            ${playerImg(p)}
            <span class="nm">${esc(p.name)}<span class="ppos">${esc(p.pos)}</span></span>
            <span class="amt">$${p.amt}</span>
          </label>`).join("") : `<div class="status" style="padding:8px">No matching players.</div>`) + `</div>`;
    }
    return `<div class="side"><h3>${label}</h3>
      <select class="teamsel" data-side="${sideKey}">${teamOpts}</select>${body}</div>`;
  }

  el.innerHTML = `<div class="trade-grid">
      ${sidePanel("A","Team A gives")}
      ${sidePanel("B","Team B gives")}
    </div>
    <div id="tradeResult"></div>`;

  el.querySelectorAll("select.teamsel").forEach(sel => sel.addEventListener("change", e => {
    const side = e.target.dataset.side;
    TRADE[side].teamIdx = e.target.value === "" ? null : Number(e.target.value);
    TRADE[side].sel = new Set(); TRADE[side].q = ""; TRADE[side].fpos = "ALL";
    paintTrade();
  }));
  el.querySelectorAll("input.psearch").forEach(inp => inp.addEventListener("input", e => {
    const side = e.target.dataset.side; TRADE[side].q = e.target.value;
    // re-render just this side's list without losing focus: full repaint is fine here (small lists)
    const pos = e.target.selectionStart; paintTrade();
    const again = document.querySelector(`input.psearch[data-side="${side}"]`);
    if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(_){} }
  }));
  el.querySelectorAll("select[data-tfilter]").forEach(sel => sel.addEventListener("change", e => {
    TRADE[e.target.dataset.tfilter].fpos = e.target.value; paintTrade();
  }));
  el.querySelectorAll(".pick input[type=checkbox]").forEach(cb => cb.addEventListener("change", e => {
    const side = e.target.dataset.side, pid = e.target.dataset.pid;
    if(e.target.checked) TRADE[side].sel.add(pid); else TRADE[side].sel.delete(pid);
    renderTradeResult();
  }));
  renderTradeResult();
}

function sumSelected(sideKey){
  const st = TRADE[sideKey]; if(st.teamIdx == null) return 0;
  return TEAMS[st.teamIdx].players.filter(p => st.sel.has(p.pid)).reduce((s,p) => s + p.amt, 0);
}

function renderTradeResult(){
  const box = document.getElementById("tradeResult"); if(!box) return;
  const a = TRADE.A, b = TRADE.B;
  if(a.teamIdx == null || b.teamIdx == null){
    box.innerHTML = `<div class="result"><div class="status">Pick a team on each side to build a trade.</div></div>`; return;
  }
  if(a.teamIdx === b.teamIdx){
    box.innerHTML = `<div class="result"><div class="verdict bad">Pick two different teams.</div></div>`; return;
  }
  const tA = TEAMS[a.teamIdx], tB = TEAMS[b.teamIdx];
  const outA = sumSelected("A"), outB = sumSelected("B");
  const projA = tA.total - outA + outB, projB = tB.total - outB + outA;
  const roomA = CAP - projA, roomB = CAP - projB;
  const overA = projA > CAP, overB = projB > CAP;

  const teamLine = (t, out, inc, proj, room, over) => `
    <div class="rline"><span class="lab">${esc(t.owner)} now</span><span class="val">$${t.total}</span></div>
    <div class="rline"><span class="lab">gives / receives</span><span class="val">-$${out} / +$${inc}</span></div>
    <div class="rline"><span class="lab rbig">${esc(t.owner)} after</span><span class="val rbig ${over?'room-over':''}">$${proj} / ${CAP}</span></div>
    <div class="rline"><span class="lab">room after</span><span class="val ${room<0?'room-over':'room-ok'}">${room<0?`$${Math.abs(room)} over`:`$${room} room`}</span></div>`;

  const anyOver = overA || overB;
  const verdict = anyOver
    ? `<div class="verdict bad">Over cap: ${[overA?tA.owner:null, overB?tB.owner:null].filter(Boolean).join(" and ")} would exceed $${CAP}.</div>`
    : `<div class="verdict ok">Both teams fit under $${CAP}.</div>`;

  box.innerHTML = `<div class="result">
      <div class="rcols">
        <div>${teamLine(tA, outA, outB, projA, roomA, overA)}</div>
        <div>${teamLine(tB, outB, outA, projB, roomB, overB)}</div>
      </div>
      ${verdict}
      <div class="swap-note">Salary travels with the player. Cap = $${CAP} (config).</div>
    </div>`;
}

// ---- load + paint ----
async function load(){
  const status = document.getElementById("status");
  const errbox = document.getElementById("errbox");
  errbox.innerHTML = ""; status.textContent = "Pulling live data…";
  try{
    TEAMS = await buildSalaries();
    for(const k of ["A","B"]){ const st = TRADE[k]; if(st.teamIdx != null && !TEAMS[st.teamIdx]){ st.teamIdx = null; st.sel = new Set(); } }
    document.getElementById("sub").textContent = `${TEAMS.length} teams · season ${SEASON}`;
    document.getElementById("capLabel").textContent = `$${CAP}`;
    paintTable(); paintTrade();
    status.textContent = `Updated ${new Date().toLocaleTimeString()}`;
    document.getElementById("foot").innerHTML =
      `Live from the public Sleeper API on each load. Cap is a config value (currently $${CAP}). No fair/unfair judgment — just the numbers.`;
  }catch(e){
    errbox.innerHTML = `<div class="err">Couldn't load: ${esc(e.message)}. Try Refresh.</div>`;
    status.textContent = "";
  }
}

// ---- tabs ----
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  ACTIVE_TAB = t.dataset.tab;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x===t));
  document.getElementById("pane-table").classList.toggle("hide", ACTIVE_TAB!=="table");
  document.getElementById("pane-trade").classList.toggle("hide", ACTIVE_TAB!=="trade");
}));
document.getElementById("refreshBtn").addEventListener("click", load);
document.getElementById("autoRefresh").addEventListener("change", e => {
  if(e.target.checked){ AUTO = setInterval(load, 60000); } else { clearInterval(AUTO); AUTO = null; }
});

load();
</script>
</body>
