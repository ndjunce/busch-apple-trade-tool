<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("bs-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Busch Apple — Salary & Trade Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/family.css?v=1.0.3">
<style>
  :root{--accent:#D0503C;--accent-text-dark:#E8705E;--accent-text-light:#A93A28}
  /* OWNER OVERRIDE (2026-10-13): Busch keeps its production position hues (QB orange, RB green, WR blue, TE purple,
     K grey, DEF red, DL pink, LB cyan, DB lime). Dark = production values; light = darker shades of the same hue for
     >=4.5:1 text on white. --oc-mix = how much of an owner color survives when it is used as TEXT (rest = --text). */
  :root{--pos-qb:#F0913E;--pos-rb:#33E08A;--pos-wr:#4AA8FF;--pos-te:#B878FF;--pos-k:#95A5A6;
        --pos-def:#FF6060;--pos-dl:#E0679A;--pos-lb:#67C7E0;--pos-db:#C7E067;--oc-mix:65%}
  :root[data-theme="light"]{--pos-qb:#B3590F;--pos-rb:#187A4F;--pos-wr:#1F6FBF;--pos-te:#7B3FC4;--pos-k:#5E6673;
        --pos-def:#C23B44;--pos-dl:#A8467A;--pos-lb:#17707F;--pos-db:#5F6D18;--oc-mix:40%}
  @media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){--pos-qb:#B3590F;--pos-rb:#187A4F;--pos-wr:#1F6FBF;--pos-te:#7B3FC4;--pos-k:#5E6673;
        --pos-def:#C23B44;--pos-dl:#A8467A;--pos-lb:#17707F;--pos-db:#5F6D18;--oc-mix:40%} }

  .wrap{max-width:1120px;margin:0 auto;padding:0 var(--sp-4) var(--sp-6)}

  /* ---- app bar: wordmark + context left, freshness + actions right; wraps to 2 rows under 480px ---- */
  .bs-appbar{flex-wrap:wrap;row-gap:var(--sp-2);padding:var(--sp-2) var(--sp-4)}
  h1.bs-wordmark{margin:0}
  .ab-id{display:flex;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap;min-width:0}
  .ab-tools{display:flex;align-items:center;gap:var(--sp-2);margin-left:auto;flex-wrap:wrap}
  .bs-appbar .ab-tools .bs-fresh{margin-left:0;margin-right:var(--sp-1)}
  .ab-auto{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:36px;font-size:var(--fs-meta);color:var(--text-2);cursor:pointer}
  .ab-auto input{accent-color:var(--accent);margin:0}
  @media(max-width:479px){ .ab-tools{width:100%;margin-left:0} }

  .tabs-row{margin:var(--sp-3) 0 var(--sp-4)}
  .loading{color:var(--text-2);padding:var(--sp-6) 0;text-align:center}
  .err{color:var(--down);border:1px solid var(--down);border-radius:var(--r-panel);padding:var(--sp-3);margin:var(--sp-3) 0;font-size:13px}
  .empty{color:var(--text-2);font-size:13px;margin:0;padding:var(--sp-3)}
  .hide{display:none}

  /* ---- player image chain: headshot -> team logo -> initial ---- */
  .pimg-wrap{width:28px;height:28px;flex:0 0 28px;display:inline-flex;align-items:center;justify-content:center}
  .pimg{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:top center;background:var(--surface-2);display:block}
  .pimg.is-logo{object-fit:contain;background:#fff;padding:3px;outline:1px solid var(--border);outline-offset:-1px}
  .pimg-fb{width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;
           font-size:13px;font-weight:600;background:var(--surface-2);border:1px solid var(--border)}
  .pick-ic{width:28px;height:28px;flex:0 0 28px;border-radius:var(--r-chip);display:inline-flex;align-items:center;justify-content:center;
           font:600 var(--fs-micro)/1 var(--font-display);letter-spacing:.06em;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}
  .oav{width:24px;height:24px;flex:0 0 24px;border-radius:50%;object-fit:cover;background:var(--surface-2);display:inline-block}
  .cell-flex{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
  .nm-cell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .ppos{color:var(--text-2);font-size:12px;font-weight:600;margin-left:var(--sp-1)}
  .pteam{color:var(--text-2);font-size:12px;margin-left:var(--sp-1);text-transform:uppercase}

  /* ---- Teams tab: cap table + roster panels ---- */
  .cc-head{margin:0 0 var(--sp-2);font-size:15px;font-weight:600}
  .cap-table td.view-cell,.cap-table th.view-cell{width:48px}
  .cap-table input[type=checkbox],.pick>input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0;cursor:pointer}
  .cap-actions{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin:var(--sp-3) 0 var(--sp-4)}
  .sel-count{color:var(--text-2);font-size:var(--fs-meta)}
  .cols{display:grid;gap:var(--sp-3)}
  .cols.n1{grid-template-columns:1fr}
  .cols.n2{grid-template-columns:repeat(2,1fr)}
  .cols.n3{grid-template-columns:repeat(3,1fr)}
  .cols.n4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:900px){.cols.n3,.cols.n4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:620px){.cols.n2,.cols.n3,.cols.n4{grid-template-columns:1fr}}
  .team{min-width:0;margin:0;overflow:hidden}
  .team-head{flex-wrap:wrap;row-gap:var(--sp-2);padding:var(--sp-2) var(--sp-3)}
  .team-id{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
  .sn{display:block;font-size:var(--fs-meta);color:var(--text-2)}
  .team-fin{margin-left:auto;text-align:right;font-size:13px;line-height:1.3}
  .team-total{display:block;font:600 var(--fs-card)/1.1 var(--font-display);font-variant-numeric:tabular-nums}
  .team-ctrls{display:flex;gap:var(--sp-2);width:100%}
  .team-ctrls .bs-select{flex:1 1 0;min-width:0}
  .capbar{height:4px;background:var(--surface-2)}
  .capbar .fill{height:100%;background:var(--accent)}
  .capbar .fill.over{background:var(--down)}
  .roster-table td.pl{max-width:0;width:100%}

  /* ---- Salary Grid ---- */
  .grid-ctrls{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-3)}
  .seg-lab{font-size:var(--fs-meta);color:var(--text-2)}
  .grid-count{color:var(--text-2);font-size:var(--fs-meta);margin-left:auto}
  .g-pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:26vw}
  .seg-wrap{display:inline-flex;align-items:center;gap:var(--sp-1)}
  @media(min-width:720px){.g-pname{max-width:none}}
  .gpos{font-weight:600}

  /* cards: neutral tile; position/owner shown as a 3px left bar (data-posbar), never a full-tile fill */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:var(--sp-2)}
  .ptile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-chip);padding:var(--sp-2);
         line-height:1.2;min-width:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center}
  .ptile .pt-face{margin-bottom:var(--sp-1)}
  .ptile .pimg,.ptile .pimg-fb,.ptile .pimg-wrap{width:40px;height:40px;flex:0 0 40px}
  .ptile .pimg-fb{font-size:16px}
  .pt-name{font-weight:600;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pt-meta{display:flex;gap:var(--sp-1);align-items:center;justify-content:center}
  .pt-pos{font-weight:600;font-size:11px}
  .pt-team{color:var(--text-2);font-size:11px}
  .pt-own{color:var(--text-2);font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pt-sal{margin-top:var(--sp-1);font:600 var(--fs-card)/1 var(--font-display);font-variant-numeric:tabular-nums}
  /* Color: Owner + Position (default, = production): position-tinted fill + owner-colored frame + owner-colored name */
  .ptile.tint{--pc:var(--pos-k);background:var(--surface);background:color-mix(in srgb,var(--pc) 15%,var(--surface));
    border-color:var(--oc,var(--border));box-shadow:inset 0 0 0 2px var(--oc,transparent)}
  .ptile.tint-QB{--pc:var(--pos-qb)} .ptile.tint-RB{--pc:var(--pos-rb)} .ptile.tint-WR{--pc:var(--pos-wr)} .ptile.tint-TE{--pc:var(--pos-te)}
  .ptile.tint-K{--pc:var(--pos-k)} .ptile.tint-DEF{--pc:var(--pos-def)} .ptile.tint-DL{--pc:var(--pos-dl)} .ptile.tint-LB{--pc:var(--pos-lb)} .ptile.tint-DB{--pc:var(--pos-db)}
  .oc-text{color:var(--oc);color:color-mix(in srgb,var(--oc) var(--oc-mix),var(--text));font-weight:600}
  @media(max-width:480px){
    .card-grid{grid-template-columns:repeat(3,1fr);gap:var(--sp-1)}
    .ptile{padding:var(--sp-1)}
    .ptile .pimg,.ptile .pimg-fb,.ptile .pimg-wrap{width:32px;height:32px;flex:0 0 32px}
    .pt-name{font-size:11px}.pt-pos{font-size:11px}.pt-team{font-size:11px}
    .pt-own{font-size:11px}.pt-sal{font-size:15px}
  }

  /* owner-color legend (Color: Owner) */
  .owner-legend{display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-3);margin:0 0 var(--sp-3);padding:var(--sp-2) var(--sp-3);
                border:1px solid var(--border);border-radius:var(--r-panel);background:var(--surface)}
  .ol-item{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:12px}
  .ol-sw{width:12px;height:12px;flex:0 0 12px;border-radius:var(--r-chip);border:1px solid var(--border)}

  /* By-Position $ chart */
  .bc-head{font-size:15px;font-weight:600;margin:var(--sp-1) 0 var(--sp-3)}
  .bc-chart{display:flex;flex-direction:column;gap:var(--sp-2)}
  .bc-row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:var(--sp-2)}
  .bc-lab{font:600 13px/1 var(--font-display);letter-spacing:.04em;text-align:right}
  .bc-track{height:16px;background:var(--surface-2);border-radius:2px;overflow:hidden}
  .bc-bar{height:100%;border-radius:2px;min-width:2px}
  .bc-val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bc-n{color:var(--text-2);font-weight:400;font-size:12px}
  .pos-bg-QB{background:var(--pos-qb)}.pos-bg-RB{background:var(--pos-rb)}.pos-bg-WR{background:var(--pos-wr)}
  .pos-bg-TE{background:var(--pos-te)}.pos-bg-K{background:var(--pos-k)}.pos-bg-DEF{background:var(--pos-def)}
  .pos-bg-DL{background:var(--pos-dl)}.pos-bg-LB{background:var(--pos-lb)}.pos-bg-DB{background:var(--pos-db)}

  /* ---- Trade builder ---- */
  .cap-help{margin:0 0 var(--sp-3)}
  .cap-help p{margin:var(--sp-2) 0 0;font-size:13px;color:var(--text-2);max-width:68ch}
  .tt-chips{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin:var(--sp-2) 0}
  .tt-chips .oav{width:20px;height:20px;flex:0 0 20px}
  .tt-note{color:var(--text-2);font-size:var(--fs-meta);margin:0 0 var(--sp-3)}
  .trade-panels{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  @media(max-width:620px){.trade-panels{grid-template-columns:1fr}}
  .side{min-width:0;margin:0;overflow:hidden}
  .side-tot{margin-left:auto;font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
  .side-ctrls{display:flex;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border)}
  .side-ctrls .bs-input{flex:1 1 auto;min-width:0}
  .picklist{max-height:360px;overflow-y:auto}
  .list-head{padding:var(--sp-2) var(--sp-3) var(--sp-1);border-bottom:1px solid var(--border)}
  .pick{display:flex;align-items:center;gap:var(--sp-2);min-height:40px;padding:0 var(--sp-3);border-bottom:1px solid var(--border);font-size:13px}
  .pick:hover{background:var(--surface-2)}
  .pick .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .pick .amt{font-variant-numeric:tabular-nums;color:var(--text-2);flex:0 0 auto}
  .pick.sel{background:var(--surface-2)}
  .pick.sel .amt{color:var(--text)}
  .pick .dest{flex:0 0 auto;min-height:32px;max-width:132px}
  .result{margin-top:var(--sp-4)}
  .verdict{margin:var(--sp-3) 0 0;font-size:15px;font-weight:600}

  /* screenshot-ready trade summary: flat panel, no box-in-box */
  .ts-card{margin:var(--sp-4) 0 0}
  .ts-head{justify-content:space-between}
  .ts-title{font:600 var(--fs-card)/1.2 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
  .bs-panel-head .ts-date{color:var(--text-2);font-size:var(--fs-meta)}
  .ts-team{padding:var(--sp-3);border-bottom:1px solid var(--border)}
  .ts-tname{display:flex;align-items:center;gap:var(--sp-2);font-size:15px;font-weight:600;margin-bottom:var(--sp-2)}
  .ts-av{width:24px;height:24px;flex:0 0 24px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
  .ts-cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
  @media(max-width:420px){.ts-cols{grid-template-columns:1fr;gap:var(--sp-2)}}
  .bs-micro.gives{color:var(--down)} .bs-micro.gets{color:var(--up)}
  .ts-list{list-style:none;margin:var(--sp-1) 0 0;padding:0}
  .ts-list li{font-size:13px;padding:2px 0;display:flex;justify-content:space-between;gap:var(--sp-2)}
  .ts-amt{color:var(--text-2);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .ts-sub{font-size:12px;font-weight:600;margin-top:var(--sp-1);border-top:1px dashed var(--border);padding-top:var(--sp-1);font-variant-numeric:tabular-nums}
  .ts-none{color:var(--text-2);font-size:13px}
  .ts-after{margin-top:var(--sp-2);font-size:13px;font-variant-numeric:tabular-nums}
  .ts-after b{font-weight:600} .ts-over{color:var(--down)}
  .ts-verdict{margin:0;padding:var(--sp-3);font-size:15px;font-weight:600}
  .ts-foot{color:var(--text-2);font-size:var(--fs-micro);margin:0;padding:0 var(--sp-3) var(--sp-3)}
  .ts-actions{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-3)}
  .copy-msg{color:var(--text-2);font-size:var(--fs-meta)}
</style>
</head>
<body>
<header class="bs-appbar">
  <div class="ab-id">
    <h1 class="bs-wordmark">Busch Apple</h1>
    <span class="bs-meta" id="sub">Salary &amp; trade tool · 10 teams · 2026 · cap $515</span>
  </div>
  <div class="ab-tools">
    <span class="bs-fresh" id="status" role="status">Sleeper · loading…</span>
    <button type="button" class="bs-btn" id="refreshBtn">Refresh</button>
    <label class="ab-auto"><input type="checkbox" id="autoRefresh"> Auto 60s</label>
    <button type="button" class="bs-btn" id="themeBtn" aria-label="Color theme: system. Activate to change.">Theme: System</button>
  </div>
</header>

<div class="wrap">
  <div class="tabs-row">
    <div class="bs-tabs" role="tablist" aria-label="Sections" id="tabs">
      <button type="button" role="tab" id="tab-teams" data-key="teams" aria-controls="pane-table" aria-selected="false" tabindex="-1">Teams</button>
      <button type="button" role="tab" id="tab-grid"  data-key="grid"  aria-controls="pane-grid" aria-selected="true" tabindex="0">Salary Grid</button>
      <button type="button" role="tab" id="tab-trade" data-key="trade" aria-controls="pane-trade" aria-selected="false" tabindex="-1">Trade Builder</button>
    </div>
  </div>

  <div id="errbox"></div>

  <div id="pane-table" class="hide" role="tabpanel" aria-labelledby="tab-teams" tabindex="0"><div class="loading">Loading…</div></div>
  <div id="pane-grid" role="tabpanel" aria-labelledby="tab-grid" tabindex="0"><div class="loading">Loading…</div></div>
  <div id="pane-trade" class="hide" role="tabpanel" aria-labelledby="tab-trade" tabindex="0"><div class="loading">Loading…</div></div>
</div>

<script>
/* =============================================================================
   Busch Apple Salary & Trade Tool — standalone, public Sleeper API only.
   v3: multi-team trades (per-asset destination selector), future draft capital
   as $0 tradeable assets (9-pick baseline adjusted by traded_picks), $515 note.
   Salary resolver dollar logic unchanged from v1 (auction -> FAAB bid -> rookie
   scale -> $1 floor), re-verified. Picks are $0 and NEVER count toward the cap.
   Cap is a CONFIG value (365 now, flip to 515 when the vote passes).
   ============================================================================= */

// ---- CONFIG ----
const CAP = 515;                    // $515 cap ADOPTED by unanimous league vote 2026-09-16 ($365 auction + $150 FAAB combined)
const SHOW_CAP = true;              // cap display ON: shows total / $515, room, and over-cap flags.
                                    //     (Was 365 / false while the vote was open; vote passed 10/10 -> flipped to 515 / true.)
const LEAGUE_ID = "1372256037666574336";
const SEASON = "2026";
const API = "https://api.sleeper.app/v1";
const PLAYERS_KEY = "busch_players_nfl_v2", PLAYERS_TS = "busch_players_nfl_ts_v2", PLAYERS_TTL = 1000*60*60*24;

// future draft capital: every team starts with own 1st/2nd/3rd for these years (adjusted by traded_picks)
const PICK_YEARS = [2027, 2028, 2029];
const PICK_ROUNDS = [1, 2, 3];
function roundLabel(r){ return r===1?"1st":r===2?"2nd":r===3?"3rd":`${r}th`; }

const ROOKIE_SCALE = {
  "1.01":10,"1.02":10,"1.03":9,"1.04":9,"1.05":9,"1.06":8,"1.07":8,"1.08":8,"1.09":7,"1.10":7,
  "2.01":7,"2.02":6,"2.03":6,"2.04":6,"2.05":5,"2.06":5,"2.07":5,"2.08":4,"2.09":4,"2.10":4,
  "3.01":3,"3.02":3,"3.03":3,"3.04":2,"3.05":2,"3.06":2,"3.07":1,"3.08":1,"3.09":1,"3.10":1
};
const OWNER = {
  rearmostzeus:"Zach", Nyquilbandit:"Henry", Sdljunce:"Seth", ChayDyck:"Chay", RileyHeid13:"Riley",
  JunceBoxes:"Nick", charliehorejsi:"Charlie", TheZynBandit:"Bobby", DaBigDyck:"Ajay", BigBomboclaat69:"Jonah"
};
// Stable color per fantasy manager (keyed by display name) = the PRODUCTION palette (owner override 2026-10-13).
// Used as the card frame, the 3px bar and the legend swatch at full strength; as TEXT it goes through .oc-text,
// which mixes it toward --text per theme (--oc-mix) for contrast while keeping the same hue.
const OWNER_COLORS = {
  Zach:"#ff3b6b", Henry:"#ffd23f", Seth:"#00d1b2", Chay:"#8b5cf6", Riley:"#ff8c3b",
  Nick:"#17b2ff", Charlie:"#e879f9", Bobby:"#7cff5c", Ajay:"#ff5ce1", Jonah:"#5c7cff"
};
function ownerColor(name){ return OWNER_COLORS[name] || "#9aa6b4"; }
const POS_ORDER = ["QB","RB","WR","TE","K","DEF","DL","LB","DB"];

// ---- state ----
let TEAMS = [];          // [{roster_id, owner, sn, avatar, players:[...], picks:[{year,round,label,key,fromRid}], total, room}]
let DATA_READY = false;  // cap results require a complete successful refresh
let LOADING = false;
let PLAYERS = null;
let AUTO = null;
let ACTIVE_TAB = "grid";        // hash key: "teams" | "grid" | "trade"; Salary Grid is the landing view
const SELECTED = new Set();     // Teams tab: roster_ids or "__ALL__"
const SORT = {};                // Teams tab per roster_id
const FILTER = {};              // Teams tab per roster_id

// Salary Grid tab: league-wide sortable/filterable list of all rostered players
let GRID_SORT = "amt";          // amt | pos | team | owner | name
let GRID_DIR = -1;              // 1 asc, -1 desc (salary defaults high->low)
let GRID_VIEW = "table";        // "table" | "cards" | "chart" (same data; branch only the render) — default = Table (#grid/cards opens Cards)
let GRID_CHART_TEAM = null;     // roster_id selected in the By-Position $ chart view (null -> first team)
const GRID_FILTER = { pos:"ALL", team:"ALL", owner:"ALL" };

// Trade tab (multi-team): ordered team list + per-team search/filter + selected assets w/ destination
let TRADE_TEAMS = [];           // ordered array of roster_ids in the trade
const TRADE_UI = {};            // roster_id -> {q, fpos}
// assets: Map assetKey -> { fromRid, toRid, kind:'player'|'pick', amt, label, meta }
const TRADE_ASSETS = new Map();

async function j(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error(`${r.status} ${url.split("/v1/")[1]||url}`); return r.json(); }
async function list(url){ const data = await j(url); if(!Array.isArray(data)) throw new Error(`Invalid list: ${url.split("/v1/")[1]||url}`); return data; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function teamByRid(rid){ return TEAMS.find(t => t.roster_id === rid) || null; }
function ownerNameOfRid(rid){ const t = teamByRid(rid); return t ? t.owner : `#${rid}`; }
// pick label with "(via X)" when the pick originated from a different team than the current holder
function pickLabel(pk, holderRid){ return pk.origRid !== holderRid ? `${pk.label} (via ${esc(ownerNameOfRid(pk.origRid))})` : pk.label; }
// compact NFL team label for a player row (e.g. "· BUF"); "FA" if no pro team; never fabricated
function teamTag(p){ const t = (p.team||"").toUpperCase(); return `<span class="pteam">· ${t?esc(t):"FA"}</span>`; }

// ---- player images (headshot -> team logo -> position initial) ----
function headshotUrl(espnId){ return `https://a.espncdn.com/i/headshots/nfl/players/full/${espnId}.png`; }
function teamLogoUrl(team){ return `https://a.espncdn.com/i/teamlogos/nfl/500/scoreboard/${String(team).toLowerCase()}.png`; }
// Sleeper CDN headshot, keyed by the Sleeper player_id (the tool's primary key — EVERY player has one).
function sleeperHeadshotUrl(pid){ return `https://sleepercdn.com/content/nfl/players/thumb/${pid}.jpg`; }

// Universal, loop-free image fallback. Shared by EVERY tab (Teams, Trade, Salary Grid).
// Order: ESPN headshot (if espnId) -> Sleeper headshot (always, by player_id) -> team logo -> position initial.
// Implementation: the first available src loads immediately; the remaining sources ride on the <img> as a
// JSON data-fb list. One onerror handler (imgFallback) advances to the next src, flagging team-logo styling,
// and shows the initial span once the list is exhausted. No nested closures = no re-entry/loop.
function imgFallbackAttr(remaining){
  // remaining = ordered array of {u:url, logo:bool}; handler shifts the next on each error.
  const json = esc(JSON.stringify(remaining));
  return `data-fb="${json}" onerror="imgFallback(this)"`;
}
function playerImg(p){
  const initial = esc((String(p.name||"?").trim()[0]||"?").toUpperCase());
  const team = (p.team||"").toUpperCase();
  const pos = esc(p.pos||"");
  const pid = p.pid!=null ? String(p.pid) : (p.sleeperId!=null ? String(p.sleeperId) : "");
  const fb = `<span class="pimg-fb pos-${pos}" style="display:none">${initial}</span>`;

  // Build the ordered source chain for THIS player.
  const chain = [];
  if(p.espnId) chain.push({ u: headshotUrl(p.espnId), logo:false });
  if(pid)      chain.push({ u: sleeperHeadshotUrl(pid), logo:false });   // NEW universal catch-all
  if(team)     chain.push({ u: teamLogoUrl(team), logo:true });

  if(!chain.length){
    // no id and no team -> straight to the position initial
    return `<span class="pimg-wrap"><span class="pimg-fb pos-${pos}" style="display:inline-flex">${initial}</span></span>`;
  }
  const first = chain[0];
  const rest = chain.slice(1);                 // what onerror walks through next
  const logoCls = first.logo ? " is-logo" : "";
  return `<span class="pimg-wrap"><img class="pimg${logoCls}" src="${first.u}" alt="" loading="lazy" ${imgFallbackAttr(rest)}>${fb}</span>`;
}
// one shared error handler for the image chain (defined on window so inline onerror can see it)
function imgFallback(img){
  let list = [];
  try{ list = JSON.parse(img.getAttribute("data-fb")||"[]"); }catch(e){ list = []; }
  if(list.length){
    const next = list.shift();
    img.classList.toggle("is-logo", !!next.logo);
    img.setAttribute("data-fb", JSON.stringify(list));
    img.src = next.u;                          // try the next source
  } else {
    img.onerror = null;                        // exhausted -> show the position-initial span
    img.style.display = "none";
    const s = img.parentNode && img.parentNode.querySelector(".pimg-fb");
    if(s) s.style.display = "inline-flex";
  }
}
window.imgFallback = imgFallback;
function pickIcon(){ return `<span class="pick-ic" aria-hidden="true">PK</span>`; }

// ---- players dict cached 24h (keeps espn_id + team for images) ----
async function loadPlayers(){
  try{
    const ts = +(localStorage.getItem(PLAYERS_TS)||0), cached = localStorage.getItem(PLAYERS_KEY);
    if(cached && (Date.now()-ts) < PLAYERS_TTL) return JSON.parse(cached);
  }catch(e){}
  const all = await j(`${API}/players/nfl`);
  const slim = {};
  for(const id in all){ const p = all[id]; if(!p) continue;
    slim[id] = { n: p.full_name || `${p.first_name||""} ${p.last_name||""}`.trim() || id,
                 pos: p.position || "?", e: p.espn_id || "", t: p.team || "" }; }
  try{ localStorage.setItem(PLAYERS_KEY, JSON.stringify(slim)); localStorage.setItem(PLAYERS_TS, String(Date.now())); }catch(e){}
  return slim;
}

// ---- build future draft capital per roster: 9-pick baseline, adjusted by traded_picks ----
// Sleeper traded_picks: {season, round, roster_id (ORIGINAL owner = whose pick it is), owner_id (CURRENT owner)}.
// A pick's IDENTITY is (year, round, originalRoster) — a team can hold multiple picks of the same year+round
// if it acquired another team's, so we track by ORIGIN, not just year-round (a Set would collapse duplicates).
function buildPicksByRoster(rosterIds, tradedPicks){
  // current owner per pick identity; seed with each team owning its own picks
  const ownerOf = {};                  // "year-round-origRid" -> current roster_id
  for(const rid of rosterIds)
    for(const y of PICK_YEARS) for(const r of PICK_ROUNDS) ownerOf[`${y}-${r}-${rid}`] = rid;
  // apply trades (only tracked years/rounds): move that specific pick (identified by its ORIGINAL roster) to the new owner
  for(const tp of (tradedPicks||[])){
    const y = Number(tp.season), r = Number(tp.round);
    if(!PICK_YEARS.includes(y) || !PICK_ROUNDS.includes(r)) continue;
    const id = `${y}-${r}-${tp.roster_id}`;         // roster_id = the pick's original owner
    if(id in ownerOf) ownerOf[id] = tp.owner_id;    // owner_id = current holder
  }
  // materialize per current owner; label notes origin when it's not your own (e.g. "2027 1st (via Chay)")
  const ridOwnerName = {}; // filled by caller-independent map below via OWNER lookup at render; here we just keep origRid
  const out = {}; rosterIds.forEach(rid => out[rid] = []);
  for(const idKey in ownerOf){
    const cur = ownerOf[idKey];
    const [y, r, origRid] = idKey.split("-").map(Number);
    if(!out[cur]) out[cur] = [];
    out[cur].push({ year:y, round:r, origRid,
      label:`${y} ${roundLabel(r)}`, ykey:`${y}-${r}-${origRid}`, key:`k:${cur}:${y}-${r}-${origRid}`, fromRid:cur });
  }
  for(const rid of rosterIds) out[rid].sort((a,b) => a.year - b.year || a.round - b.round || a.origRid - b.origRid);
  return out;
}

// ---- build salaries + picks from live Sleeper (dollar logic identical to v1) ----
async function buildSalaries(){
  const [rosters, users, drafts, tradedPicks, players] = await Promise.all([
    list(`${API}/league/${LEAGUE_ID}/rosters`),
    list(`${API}/league/${LEAGUE_ID}/users`),
    list(`${API}/league/${LEAGUE_ID}/drafts`),
    list(`${API}/league/${LEAGUE_ID}/traded_picks`),
    loadPlayers(),
  ]);
  PLAYERS = players;
  const uById = {}; users.forEach(u => uById[u.user_id] = u);

  // Parallel fetch (2026-10 redesign): all draft-pick and transaction-week requests go out at once, then the
  // results are consumed in the SAME order as the old serial loops (auctions by start_time, rookies in drafts
  // order, weeks 1 -> 18), so auc overwrites and faabAdds push order are identical. Dollar logic unchanged.
  const auctions = drafts.filter(d => d.type === "auction").sort((a,b) => (a.start_time||0) - (b.start_time||0));
  const rookies  = drafts.filter(d => d.type !== "auction");
  const WEEKS = Array.from({length:18}, (_,i) => i+1);
  const [aucPicks, rookPicks, txnsByWeek] = await Promise.all([
    Promise.all(auctions.map(d => list(`${API}/draft/${d.draft_id}/picks`))),
    Promise.all(rookies.map(d => list(`${API}/draft/${d.draft_id}/picks`))),
    Promise.all(WEEKS.map(wk => list(`${API}/league/${LEAGUE_ID}/transactions/${wk}`))), // missing history must not become a salary estimate
  ]);
  const auc = {};
  aucPicks.forEach(picks => {
    for(const p of picks){ const a = p.metadata && p.metadata.amount; if(p.player_id != null && a != null) auc[String(p.player_id)] = Number(a); }
  });
  const rook = {};
  rookPicks.forEach(picks => {
    for(const p of picks){ const s = `${p.round}.${String(p.draft_slot).padStart(2,"0")}`; if(p.player_id != null && ROOKIE_SCALE[s] != null) rook[String(p.player_id)] = ROOKIE_SCALE[s]; }
  });
  // Replay completed acquisition events by player ID and timestamp. Waiver/free-agent adds reset
  // salary; trades carry it. This uses all owners' events, including the price paid before a trade.
  const faabAdds = {};   // pid -> [{toRosterId, bid, ts}]
  txnsByWeek.forEach(txns => {
    for(const x of (txns||[])){
      if(x.status !== "complete") continue;
      const bid = x.settings && x.settings.waiver_bid;
      if(x.adds){
        // T3-3 (2026-10-09): record EVERY add (waiver, free_agent, trade) with its type, not just FAAB claims,
        // so the resolver can apply the league rule: a dropped player has no salary; the next team pays its
        // winning FAAB bid, or $1 for a normal free-agent pickup. Trades carry the salary unchanged.
        const ts = Number(x.status_updated != null ? x.status_updated : (x.created != null ? x.created : 0));
        for(const pid of Object.keys(x.adds)){
          const toRosterId = x.adds[pid];
          (faabAdds[pid] || (faabAdds[pid] = [])).push({ toRosterId, type: x.type, bid: bid != null ? Number(bid) : null, ts });
        }
      }
    }
  });
  // T3-3 RULE (owner, 2026-10-09): a dropped player has NO salary. Whoever picks him up next pays their winning
  // FAAB bid (waiver claim) or $1 (a normal free-agent pickup). A trade carries the salary unchanged.
  // So we replay the player's add events oldest -> newest starting from the auction/rookie price:
  // waiver(bid) -> price = bid; free_agent -> price = $1; trade -> unchanged. This supersedes the older
  // 'current owner's FAAB claim first' logic (which let a stale auction price survive a drop + free-agent re-add:
  // Keenan Allen $7, Tyreek Hill $5, ... now correctly $1).
  function sal(pid, rosterId){ pid = String(pid);
    let price = auc[pid] != null ? auc[pid] : (rook[pid] != null ? rook[pid] : 1);
    const evs = (faabAdds[pid] || []).slice().sort((a, b) => a.ts - b.ts);
    for(const e of evs){
      if(e.type === "waiver" && e.bid != null) price = e.bid;
      else if(e.type === "free_agent") price = 1;
    }
    return price;
  }
  const P = pid => PLAYERS[pid] || null;

  const rosterIds = rosters.map(r => r.roster_id);
  const picksByRoster = buildPicksByRoster(rosterIds, tradedPicks);

  const teams = rosters.map(r => {
    const u = uById[r.owner_id] || {};
    const sn = u.display_name || u.username || "?";
    const owner = OWNER[sn] || sn;
    const avatar = u.avatar ? `https://sleepercdn.com/avatars/thumbs/${u.avatar}` : null;
    const ps = (r.players||[]).map(pid => {
      const p = P(pid);
      return { pid: String(pid), name: p?p.n:`id ${pid}`, pos: p?p.pos:"?", espnId: p?p.e:"", team: p?p.t:"", amt: sal(pid, r.roster_id) };
    });
    const total = ps.reduce((s,p) => s + p.amt, 0);  // picks are $0 -> never in the total
    return { roster_id: r.roster_id, owner, sn, avatar, players: ps, picks: picksByRoster[r.roster_id] || [], total, room: CAP - total };
  }).sort((a,b) => b.total - a.total);

  return teams;
}

// ---- UI state added by the 2026-10 redesign (presentation only; no salary data) ----
let GRID_COLOR = "both";        // Salary Grid color mode: "both" (default = production owner + position coloring) | "position" | "owner" | "none" (hash wins over localStorage)
const TEAMS_SORT = { key:"room", dir:-1 };   // Teams cap table sort (memory only); room/-1 = over-cap first, then most room
const PANE = { teams:"table", grid:"grid", trade:"trade" };  // hash key -> pane id suffix
let HASH_PENDING = false;       // a start-up link hash is waiting for TEAMS before it can be fully applied
let LAST_HASH = null;           // last hash written/applied (hashchange ignores our own writes)
let HASH_NOTE = "";             // one-line note when shared-link trade assets were dropped
try{ const c = localStorage.getItem("busch-grid-color"); if(c==="both"||c==="position"||c==="owner"||c==="none") GRID_COLOR = c; }catch(e){}

// ---- Teams tab: sort/filter ----
function sortedFilteredPlayers(t){
  const mode = SORT[t.roster_id] || "sal";
  const fpos = FILTER[t.roster_id] || "ALL";
  let ps = t.players.slice();
  if(fpos !== "ALL") ps = ps.filter(p => p.pos === fpos);
  ps.sort((a,b) => {
    if(mode === "name") return a.name.localeCompare(b.name);
    if(mode === "pos")  return (POS_ORDER.indexOf(a.pos) - POS_ORDER.indexOf(b.pos)) || (b.amt - a.amt) || a.name.localeCompare(b.name);
    return (b.amt - a.amt) || a.name.localeCompare(b.name);
  });
  return ps;
}
function teamPositions(t){
  const present = new Set(t.players.map(p => p.pos).filter(Boolean));
  const known = POS_ORDER.filter(p => present.has(p));
  const extra = [...present].filter(p => !POS_ORDER.includes(p)).sort();
  return known.concat(extra);
}

function avatarImg(t, cls){ return t.avatar
  ? `<img class="${cls}" src="${t.avatar}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
  : `<span class="${cls}"></span>`; }

// ---- focus keeper: a repaint replaces innerHTML, so put focus back on the same control ----
const FOCUS_KEYS = ["view","color","sort","csort","pick","tteam","pid","pickkey","destfor","filter","filterrid"];
function focusKey(scope){
  const a = document.activeElement;
  if(!a || !scope.contains(a) || a === scope) return null;
  if(a.id) return "#" + a.id;
  for(const k of FOCUS_KEYS) if(a.dataset && a.dataset[k] != null) return `${a.tagName.toLowerCase()}[data-${k}="${a.dataset[k]}"]`;
  return null;
}
function restoreFocus(scope, key){ if(!key) return; try{ const n = scope.querySelector(key); if(n) n.focus(); }catch(e){} }

// ---- League-wide cap table (Teams tab) ----
// Default order = over-cap first, then most room -> least (the old compliance-strip comparator, verbatim).
function capCmp(a,b){
  const ao = a.total > CAP, bo = b.total > CAP;
  if(ao !== bo) return ao ? -1 : 1;                 // over-cap first
  return b.room - a.room;                           // then most room -> least
}
function capSorted(){
  const rows = TEAMS.slice();
  const k = TEAMS_SORT.key, d = TEAMS_SORT.dir;
  if(k === "room" && d === -1) return rows.sort(capCmp);
  const val = { owner:t=>t.owner, total:t=>t.total, room:t=>t.room, players:t=>t.players.length, picks:t=>t.picks.length }[k] || (t=>t.room);
  return rows.sort((a,b) => { const x = val(a), y = val(b);
    const c = typeof x === "string" ? x.localeCompare(y) : x - y; return (d * c) || a.owner.localeCompare(b.owner); });
}
function capTable(){
  const def = TEAMS.slice().sort(capCmp);
  const over = def.filter(t => t.total > CAP);
  const compliant = def.length - over.length;
  const headline = !SHOW_CAP ? "" : (over.length
    ? `${compliant} of ${def.length} teams cap-compliant · over: ${over.map(t=>esc(t.owner)).join(", ")}`
    : `All ${def.length} teams cap-compliant`);
  const allMode = SELECTED.has("__ALL__");
  const th = (key, label, num) => {
    const on = TEAMS_SORT.key === key;
    const as = on ? ` aria-sort="${TEAMS_SORT.dir===1 ? "ascending" : "descending"}"` : "";
    return `<th${num?` class="num"`:""}${as}><button type="button" class="bs-sort" data-csort="${key}">${label}</button></th>`;
  };
  const body = capSorted().map(t => {
    const checked = (allMode || SELECTED.has(t.roster_id)) ? " checked" : "";
    const room = t.room < 0 ? `<span class="bs-down">$${Math.abs(t.room)} over</span>` : `<span class="bs-up">$${t.room}</span>`;
    return `<tr>
      <td class="view-cell"><input type="checkbox" data-pick="${t.roster_id}"${checked} aria-label="Show ${esc(t.owner)}'s roster"></td>
      <td><span class="cell-flex">${avatarImg(t,"oav")}<span>${esc(t.owner)}</span></span></td>
      <td class="num">$${t.total}</td>
      ${SHOW_CAP ? `<td class="num">${room}</td>` : ""}
      <td class="num">${t.players.length}</td>
      <td class="num">${t.picks.length}</td>
    </tr>`;
  }).join("");
  return (headline ? `<p class="cc-head ${over.length ? "bs-down" : "bs-up"}">${headline}</p>` : "")
    + `<div class="bs-panel"><div class="bs-table-wrap"><table class="bs-table bs-table--stick1 cap-table">
      <thead><tr><th class="view-cell">View</th>${th("owner","Owner")}${th("total","Total",1)}${SHOW_CAP ? th("room","Room",1) : ""}${th("players","Players",1)}${th("picks","Picks",1)}</tr></thead>
      <tbody>${body}</tbody></table></div></div>`;
}

// ---- Teams tab roster panel ----
function teamCard(t){
  const overCap = SHOW_CAP && t.total > CAP;
  const pct = Math.min(100, Math.round(t.total / CAP * 100));
  const roomCls = t.room < 0 ? "bs-down" : "bs-up";
  const roomTxt = t.room < 0 ? `$${Math.abs(t.room)} over` : `$${t.room} room`;
  const sortMode = SORT[t.roster_id] || "sal";
  const fpos = FILTER[t.roster_id] || "ALL";
  const posOpts = [`<option value="ALL"${fpos==="ALL"?" selected":""}>All pos</option>`]
    .concat(teamPositions(t).map(p => `<option value="${esc(p)}"${fpos===p?" selected":""}>${esc(p)}</option>`)).join("");
  const sortOpts = [["sal","Salary"],["pos","Position"],["name","Name"]]
    .map(([v,l]) => `<option value="${v}"${sortMode===v?" selected":""}>${l}</option>`).join("");
  const ps = sortedFilteredPlayers(t);
  const rows = ps.length ? ps.map(p => `<tr>
      <td class="pl"><span class="cell-flex">${playerImg(p)}<span class="nm-cell">${esc(p.name)}</span></span></td>
      <td><span class="gpos pos-${esc(p.pos)}">${esc(p.pos)}</span></td>
      <td class="bs-dim">${p.team ? esc(String(p.team).toUpperCase()) : "FA"}</td>
      <td class="num">$${p.amt}</td>
    </tr>`).join("") : `<tr><td colspan="4" class="bs-dim">No players at this position.</td></tr>`;
  const picks = t.picks.length ? `<tr><td colspan="4"><span class="bs-micro">Future picks · $0</span></td></tr>` +
    t.picks.map(pk => `<tr><td colspan="3"><span class="cell-flex">${pickIcon()}<span class="nm-cell">${esc(pickLabel(pk, t.roster_id))}</span></span></td><td class="num bs-dim">$0</td></tr>`).join("") : "";

  return `<section class="bs-panel team" aria-label="${esc(t.owner)} roster">
    <div class="bs-panel-head team-head">
      <span class="team-id">${avatarImg(t,"oav")}<span><span class="bs-h2">${esc(t.owner)}</span><span class="sn">@${esc(t.sn)}</span></span></span>
      <span class="team-fin">
        <span class="team-total">$${t.total}${SHOW_CAP?`<span class="bs-dim"> / ${CAP}</span>`:``}</span>
        ${SHOW_CAP?`<span class="${roomCls}">${roomTxt}</span>`:`<span class="bs-dim">total value</span>`}
      </span>
      <span class="team-ctrls">
        <select class="bs-select" data-sort="${t.roster_id}" aria-label="Sort ${esc(t.owner)}'s roster">${sortOpts}</select>
        <select class="bs-select" data-filter="${t.roster_id}" aria-label="Filter ${esc(t.owner)}'s roster by position">${posOpts}</select>
      </span>
    </div>
    ${SHOW_CAP?`<div class="capbar" aria-hidden="true"><div class="fill ${overCap?'over':''}" style="width:${pct}%"></div></div>`:``}
    <div class="bs-table-wrap bs-table-wrap--tall"><table class="bs-table roster-table">
      <thead><tr><th>Player</th><th>Pos</th><th>NFL</th><th class="num">$</th></tr></thead>
      <tbody>${rows}${picks}</tbody>
    </table></div>
  </section>`;
}

function wireTeamControls(scope){
  scope.querySelectorAll("select[data-sort]").forEach(sel => sel.addEventListener("change", e => {
    SORT[Number(e.target.dataset.sort)] = e.target.value; paintTable();
  }));
  scope.querySelectorAll("select[data-filter]").forEach(sel => sel.addEventListener("change", e => {
    FILTER[Number(e.target.dataset.filter)] = e.target.value; paintTable();
  }));
}

// ---- Teams tab ----
function paintTable(){ const el = document.getElementById("pane-table"); const fk = focusKey(el);
  try { paintTableInner(); } finally { restoreFocus(el, fk); writeHash(); } }
function paintTableInner(){
  const el = document.getElementById("pane-table");
  if(!TEAMS.length){ el.innerHTML = `<div class="loading">No teams.</div>`; return; }
  const actions = `<div class="cap-actions">
      <button type="button" class="bs-btn" id="showAllBtn">Show all 10</button>
      <button type="button" class="bs-btn" id="clearSelBtn">Clear</button>
      <span class="sel-count" id="selCount"></span>
    </div>`;

  let shown, nCol;
  const showAllMode = SELECTED.has("__ALL__");
  if(showAllMode){ shown = TEAMS.slice(); nCol = 4; }
  else if(SELECTED.size === 0){ shown = []; }
  else { shown = TEAMS.filter(t => SELECTED.has(t.roster_id)); nCol = Math.min(4, shown.length); }

  const cols = !shown.length
    ? `<p class="empty">Check View on up to 4 teams to see rosters, salaries and picks.</p>`
    : `<div class="cols n${nCol}">` + shown.map(teamCard).join("") + `</div>`;

  el.innerHTML = capTable() + actions + cols;

  el.querySelectorAll("input[data-pick]").forEach(c => c.addEventListener("change", () => {
    SELECTED.delete("__ALL__");
    const id = Number(c.dataset.pick);
    if(SELECTED.has(id)) SELECTED.delete(id);
    else { if(SELECTED.size >= 4){ const first = SELECTED.values().next().value; SELECTED.delete(first); } SELECTED.add(id); }
    paintTable();
  }));
  el.querySelectorAll("button[data-csort]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.csort;
    if(TEAMS_SORT.key === k) TEAMS_SORT.dir = -TEAMS_SORT.dir;
    else { TEAMS_SORT.key = k; TEAMS_SORT.dir = (k === "owner") ? 1 : -1; }
    paintTable();
  }));
  const showAll = el.querySelector("#showAllBtn"); if(showAll) showAll.addEventListener("click", () => { SELECTED.clear(); SELECTED.add("__ALL__"); paintTable(); });
  const clearSel = el.querySelector("#clearSelBtn"); if(clearSel) clearSel.addEventListener("click", () => { SELECTED.clear(); paintTable(); });
  const cnt = el.querySelector("#selCount");
  if(cnt) cnt.textContent = showAllMode ? "showing all 10" : SELECTED.size ? `${SELECTED.size} selected (max 4)` : "none selected";
  wireTeamControls(el);
}

/* ============================ SALARY GRID (league-wide, sortable/filterable) ============================ */
// A flat table of EVERY rostered player across all teams, with the resolver's salary (p.amt).
// Sort by any column; filter by position / NFL team / fantasy owner.

// flatten all teams -> one row per rostered player
function gridRows(){
  const rows = [];
  TEAMS.forEach(t => (t.players||[]).forEach(p => {
    rows.push({ name:p.name, pos:p.pos||"?", team:(p.team||"").toUpperCase(), owner:t.owner,
                amt:p.amt, espnId:p.espnId, pid:p.pid, _rid:t.roster_id,
                _p:{ name:p.name, pos:p.pos, team:p.team, espnId:p.espnId, pid:p.pid } });
  }));
  return rows;
}
function gridDistinct(rows, key){
  const s = new Set(rows.map(r => r[key]).filter(v => v!=null && v!==""));
  if(key==="pos") return POS_ORDER.filter(p=>s.has(p)).concat([...s].filter(p=>!POS_ORDER.includes(p)).sort());
  return [...s].sort();
}
// .bs-seg of aria-pressed buttons
function segGroup(items, cur, attr, label){
  return `<div class="bs-seg" role="group" aria-label="${label}">` + items.map(([v,l]) =>
    `<button type="button" data-${attr}="${v}" aria-pressed="${cur===v?"true":"false"}">${l}</button>`).join("") + `</div>`;
}
// 3px left bar on the first cell / tile: position color, owner color, or none
// (table "both" = position bar; cards "both" = tinted tile + owner frame, see tileAttrs)
function colorBar(r){
  if(GRID_COLOR === "position" || GRID_COLOR === "both") return ` data-posbar="${esc(r.pos)}"`;
  if(GRID_COLOR === "owner") return ` data-posbar="" style="--bar:${ownerColor(r.owner)}"`;
  return "";
}

function paintGrid(){ const el = document.getElementById("pane-grid"); const fk = focusKey(el);
  try { paintGridInner(); } finally { restoreFocus(el, fk); writeHash(); } }
function paintGridInner(){
  const el = document.getElementById("pane-grid");
  if(!TEAMS.length){ el.innerHTML = `<div class="loading">No players.</div>`; return; }
  const all = gridRows();
  const posList = gridDistinct(all, "pos");
  const teamList = gridDistinct(all, "team");
  const ownerList = TEAMS.map(t => t.owner);   // league order

  // apply filters (compose)
  let rows = all.filter(r =>
    (GRID_FILTER.pos==="ALL"   || r.pos===GRID_FILTER.pos) &&
    (GRID_FILTER.team==="ALL"  || r.team===GRID_FILTER.team) &&
    (GRID_FILTER.owner==="ALL" || r.owner===GRID_FILTER.owner));

  // sort
  const dir = GRID_DIR;
  const cmp = {
    amt:   (a,b) => (a.amt-b.amt) || a.name.localeCompare(b.name),
    pos:   (a,b) => (POS_ORDER.indexOf(a.pos)-POS_ORDER.indexOf(b.pos)) || a.name.localeCompare(b.name),
    team:  (a,b) => a.team.localeCompare(b.team) || a.name.localeCompare(b.name),
    owner: (a,b) => a.owner.localeCompare(b.owner) || (b.amt-a.amt),
    name:  (a,b) => a.name.localeCompare(b.name),
  }[GRID_SORT] || ((a,b)=>a.amt-b.amt);
  rows.sort((a,b) => dir * cmp(a,b));

  const opt = (val,sel,label) => `<option value="${esc(val)}"${sel===val?" selected":""}>${esc(label)}</option>`;
  const posSel  = [opt("ALL",GRID_FILTER.pos,"All positions")].concat(posList.map(p=>opt(p,GRID_FILTER.pos,p))).join("");
  const teamSel = [opt("ALL",GRID_FILTER.team,"All NFL teams")].concat(teamList.map(t=>opt(t,GRID_FILTER.team,t))).join("");
  const ownSel  = [opt("ALL",GRID_FILTER.owner,"All fantasy teams")].concat(ownerList.map(o=>opt(o,GRID_FILTER.owner,o))).join("");

  // view toggle (Table / Cards / Chart): same filtered+sorted rows, only the render branches
  const viewToggle = segGroup([["table","Table"],["cards","Cards"],["chart","By Position $"]], GRID_VIEW, "view", "Grid view");
  const colorToggle = `<span class="seg-wrap"><span class="seg-lab" aria-hidden="true">Color:</span>`
    + segGroup([["both","Both"],["position","Position"],["owner","Owner"],["none","None"]], GRID_COLOR, "color", "Color by") + `</span>`;

  // sort dropdown (primary control for Cards view, which has no clickable headers; also usable in Table)
  const sortDefs = [["amt","Salary"],["pos","Position"],["team","NFL team"],["owner","Fantasy team"],["name","Player name"]];
  const dirArrow = GRID_DIR===1 ? "▲" : "▼";
  const sortSel = sortDefs.map(([v,l]) => opt(v, GRID_SORT, l)).join("");

  const controls = `<div class="grid-ctrls">
    ${viewToggle}
    ${colorToggle}
    <select class="bs-select" id="gfPos" aria-label="Filter by position">${posSel}</select>
    <select class="bs-select" id="gfTeam" aria-label="Filter by NFL team">${teamSel}</select>
    <select class="bs-select" id="gfOwner" aria-label="Filter by fantasy team">${ownSel}</select>
    <select class="bs-select" id="gfSort" aria-label="Sort by">${sortSel}</select>
    <button type="button" class="bs-btn" id="gfDir" aria-label="Reverse sort order (now ${GRID_DIR===1?"ascending":"descending"})">${dirArrow}</button>
    <button type="button" class="bs-btn" id="gfReset">Reset</button>
    <span class="grid-count">${rows.length} player${rows.length===1?"":"s"}</span>
  </div>`;

  // ---- CHART VIEW: per-team salary allocation by position (own controls: view toggle + team picker) ----
  if(GRID_VIEW === "chart"){
    if(GRID_CHART_TEAM===null || !TEAMS.some(t=>t.roster_id===GRID_CHART_TEAM)) GRID_CHART_TEAM = TEAMS[0].roster_id;
    const t = TEAMS.find(x => x.roster_id===GRID_CHART_TEAM) || TEAMS[0];
    const teamOpts = TEAMS.map(x => `<option value="${x.roster_id}"${x.roster_id===t.roster_id?" selected":""}>${esc(x.owner)}</option>`).join("");
    // sum salaries per position for THIS team (reuses t.players[].amt)
    const byPos = {};
    (t.players||[]).forEach(p => { const k = p.pos||"?"; (byPos[k] = byPos[k] || {sum:0,n:0}); byPos[k].sum += p.amt; byPos[k].n++; });
    const order = POS_ORDER.filter(p => byPos[p]).concat(Object.keys(byPos).filter(p => !POS_ORDER.includes(p)).sort());
    const maxSum = Math.max(1, ...order.map(p => byPos[p].sum));
    const roomCls = t.room < 0 ? "bs-down" : "bs-up";
    const roomTxt = t.room < 0 ? `$${Math.abs(t.room)} over` : `$${t.room} room`;
    const bars = order.map(p => {
      const d = byPos[p], w = Math.round(d.sum / maxSum * 100);
      return `<div class="bc-row">
        <div class="bc-lab pos-${esc(p)}">${esc(p)}</div>
        <div class="bc-track"><div class="bc-bar pos-bg-${esc(p)}" style="width:${w}%"></div></div>
        <div class="bc-val">$${d.sum}<span class="bc-n"> · ${d.n}</span></div>
      </div>`;
    }).join("");
    const chartControls = `<div class="grid-ctrls">
      ${viewToggle}
      <select class="bs-select" id="gcTeam" aria-label="Team">${teamOpts}</select>
      <span class="grid-count">${(t.players||[]).length} players</span>
    </div>`;
    el.innerHTML = chartControls
      + `<div class="bc-head">${esc(t.owner)} · $${t.total}${SHOW_CAP?` / ${CAP}`:``} ${SHOW_CAP?`<span class="${roomCls}">(${roomTxt})</span>`:``}</div>`
      + `<div class="bc-chart">${bars || '<p class="empty">No players.</p>'}</div>`;
    // wire view toggle + team selector
    el.querySelectorAll("button[data-view]").forEach(b => b.addEventListener("click", () => { GRID_VIEW = b.dataset.view; paintGrid(); }));
    const gcTeam = el.querySelector("#gcTeam");
    if(gcTeam) gcTeam.addEventListener("change", () => { GRID_CHART_TEAM = Number(gcTeam.value); paintGrid(); });
    return;
  }

  let view;
  if(GRID_VIEW === "cards"){
    // dense tiles; auto-fill grid flows left->right then wraps down (reading order).
    // "both" (default, = production): position-tinted fill + owner-colored frame + owner-colored name.
    const both = GRID_COLOR === "both";
    const posTxt = both || GRID_COLOR === "position";
    view = `<div class="card-grid">` + rows.map(r => { const oc = ownerColor(r.owner);
      const attrs = both ? ` class="ptile tint tint-${esc(r.pos)}" style="--oc:${oc}"` : ` class="ptile"${colorBar(r)}`;
      return `<div${attrs}>
      <div class="pt-face">${playerImg(r._p)}</div>
      <div class="pt-name">${esc(r.name)}</div>
      <div class="pt-meta"><span class="pt-pos${posTxt?` pos-${esc(r.pos)}`:""}">${esc(r.pos)}</span><span class="pt-team">${r.team?esc(r.team):"FA"}</span></div>
      <div class="pt-own${both?" oc-text":""}"${both?` style="--oc:${oc}"`:""}>${esc(r.owner)}</div>
      <div class="pt-sal">$${r.amt}</div>
    </div>`; }).join("") + `</div>`;
  } else {
    const th = (col, label, cls) => {
      const on = GRID_SORT === col;
      const as = on ? ` aria-sort="${GRID_DIR===1 ? "ascending" : "descending"}"` : "";
      return `<th${cls?` class="${cls}"`:""}${as}><button type="button" class="bs-sort" data-sort="${col}">${label}</button></th>`;
    };
    const head = `<thead><tr>${th("name","Player")}${th("pos","Pos")}${th("team","NFL")}${th("owner","Owner")}${th("amt","Salary","num")}</tr></thead>`;
    const body = `<tbody>` + rows.map(r => `<tr>
      <td${colorBar(r)}><span class="cell-flex">${playerImg(r._p)}<span class="g-pname">${esc(r.name)}</span></span></td>
      <td><span class="gpos${(GRID_COLOR==="position"||GRID_COLOR==="both")?` pos-${esc(r.pos)}`:""}">${esc(r.pos)}</span></td>
      <td>${r.team ? esc(r.team) : '<span class="bs-dim">FA</span>'}</td>
      ${GRID_COLOR==="both" ? `<td class="oc-text" style="--oc:${ownerColor(r.owner)}">${esc(r.owner)}</td>` : `<td class="bs-dim">${esc(r.owner)}</td>`}
      <td class="num">$${r.amt}</td>
    </tr>`).join("") + `</tbody>`;
    view = `<div class="bs-panel"><div class="bs-table-wrap bs-table-wrap--tall"><table class="bs-table bs-table--stick1">${head}${body}</table></div></div>`;
  }

  // owner-color legend (Color: Owner) so the bars are decodable; league order, compact
  const ownerLegend = (GRID_COLOR==="owner" || GRID_COLOR==="both")
    ? `<div class="owner-legend" aria-label="Owner colors">` + TEAMS.map(t => {
        const oc = ownerColor(t.owner);
        return `<span class="ol-item"><span class="ol-sw" style="background:${oc}"></span>${esc(t.owner)}</span>`;
      }).join("") + `</div>`
    : "";
  el.innerHTML = controls + ownerLegend + view;

  // wire the view + color toggles
  el.querySelectorAll("button[data-view]").forEach(b => b.addEventListener("click", () => {
    GRID_VIEW = b.dataset.view; paintGrid();
  }));
  el.querySelectorAll("button[data-color]").forEach(b => b.addEventListener("click", () => {
    GRID_COLOR = b.dataset.color;
    try{ localStorage.setItem("busch-grid-color", GRID_COLOR); }catch(e){}
    paintGrid();
  }));
  // wire header sort (table view only)
  el.querySelectorAll("button[data-sort]").forEach(btn => btn.addEventListener("click", () => {
    const col = btn.dataset.sort;
    if(GRID_SORT===col){ GRID_DIR = -GRID_DIR; }
    else { GRID_SORT = col; GRID_DIR = (col==="amt") ? -1 : 1; }   // salary defaults high->low, text asc
    paintGrid();
  }));
  // wire the sort dropdown + direction toggle (works in both views; essential for Cards)
  const sortSelEl = el.querySelector("#gfSort");
  if(sortSelEl) sortSelEl.addEventListener("change", () => {
    GRID_SORT = sortSelEl.value; GRID_DIR = (GRID_SORT==="amt") ? -1 : 1;  // sensible default per column
    paintGrid();
  });
  const dirBtn = el.querySelector("#gfDir");
  if(dirBtn) dirBtn.addEventListener("click", () => { GRID_DIR = -GRID_DIR; paintGrid(); });
  // wire filters
  const bind = (id,key) => { const s = el.querySelector(id); if(s) s.addEventListener("change", () => { GRID_FILTER[key] = s.value; paintGrid(); }); };
  bind("#gfPos","pos"); bind("#gfTeam","team"); bind("#gfOwner","owner");
  const reset = el.querySelector("#gfReset");
  if(reset) reset.addEventListener("click", () => { GRID_FILTER.pos="ALL"; GRID_FILTER.team="ALL"; GRID_FILTER.owner="ALL"; GRID_SORT="amt"; GRID_DIR=-1; paintGrid(); });
}

/* ============================ TRADE BUILDER (multi-team) ============================ */

function capExplainer(){
  return `<details class="bs-details cap-help"><summary>How the cap works</summary>
    <p>The cap is $${CAP}: the $365 auction budget plus the $150 FAAB, one combined cap.
    Draft picks trade at $0 and never count toward it.
    Salary travels with a player in a trade.
    A dropped player has no salary, so the next team pays its winning FAAB bid, or $1 for a free-agent pickup.</p>
  </details>`;
}

function tradeTeamObjects(){ return TRADE_TEAMS.map(teamByRid).filter(Boolean); }

// destination options for an asset from team `fromRid` (any OTHER team in the trade)
function destOptions(fromRid, selectedTo){
  const opts = tradeTeamObjects().filter(t => t.roster_id !== fromRid)
    .map(t => `<option value="${t.roster_id}" ${selectedTo===t.roster_id?"selected":""}>→ ${esc(t.owner)}</option>`);
  return opts.join("");
}

function assetKindKey(kind, id){ return `${kind}:${id}`; }

function paintTrade(){
  const el = document.getElementById("pane-trade");
  if(!TEAMS.length){ el.innerHTML = `<div class="loading">No teams.</div>`; return; }
  const fk = focusKey(el);

  // team chooser (toggle teams into the trade; 2-10)
  const chips = `<div class="bs-micro">Teams in the trade (2–10)</div>
    <div class="tt-chips" role="group" aria-label="Teams in the trade">` + TEAMS.map(t => {
      const on = TRADE_TEAMS.includes(t.roster_id);
      return `<button type="button" class="bs-btn" data-tteam="${t.roster_id}" aria-pressed="${on?"true":"false"}">${avatarImg(t,"oav")}<span>${esc(t.owner)}</span></button>`;
    }).join("") + `</div>
    <p class="tt-note">${TRADE_TEAMS.length<2 ? "Pick at least two teams." : `${TRADE_TEAMS.length}-team trade. Check an asset, then choose where it goes.`}${HASH_NOTE?` ${esc(HASH_NOTE)}`:""}</p>`;

  // one panel per team in the trade
  let panels = "";
  for(const rid of TRADE_TEAMS){
    const t = teamByRid(rid); if(!t) continue;
    const ui = TRADE_UI[rid] || (TRADE_UI[rid] = { q:"", fpos:"ALL" });
    const posList = teamPositions(t);
    const fposOpts = [`<option value="ALL"${ui.fpos==="ALL"?" selected":""}>All pos</option>`]
      .concat(posList.map(p => `<option value="${esc(p)}"${ui.fpos===p?" selected":""}>${esc(p)}</option>`)).join("");
    const q = (ui.q||"").toLowerCase();
    let ps = t.players.slice().sort((a,b) => b.amt - a.amt || a.name.localeCompare(b.name));
    if(ui.fpos !== "ALL") ps = ps.filter(p => p.pos === ui.fpos);
    if(q) ps = ps.filter(p => p.name.toLowerCase().includes(q));

    const playerRows = ps.map(p => {
      const key = assetKindKey("p", p.pid);
      const a = TRADE_ASSETS.get(key);
      const on = a && a.fromRid===rid;
      const dest = on ? `<select class="bs-select dest" data-destfor="${key}" aria-label="Send ${esc(p.name)} to">${destOptions(rid, a.toRid)}</select>` : "";
      return `<div class="pick ${on?'sel':''}">
        <input type="checkbox" data-asset="player" data-rid="${rid}" data-pid="${p.pid}" ${on?"checked":""} aria-label="Trade ${esc(p.name)}">
        ${playerImg(p)}
        <span class="nm">${esc(p.name)}<span class="ppos">${esc(p.pos)}</span>${teamTag(p)}</span>
        ${dest || `<span class="amt">$${p.amt}</span>`}
      </div>`;
    }).join("");

    const pickRows = t.picks.map(pk => {
      const key = pk.key; // "k:holderRid:year-round-origRid"
      const a = TRADE_ASSETS.get(key);
      const on = a && a.fromRid===rid;
      const dest = on ? `<select class="bs-select dest" data-destfor="${esc(key)}" aria-label="Send ${esc(pk.label)} to">${destOptions(rid, a.toRid)}</select>` : "";
      return `<div class="pick ${on?'sel':''}">
        <input type="checkbox" data-asset="pick" data-rid="${rid}" data-pickkey="${esc(pk.ykey)}" ${on?"checked":""} aria-label="Trade ${esc(pickLabel(pk, rid))}">
        ${pickIcon()}
        <span class="nm">${esc(pickLabel(pk, rid))} <span class="ppos">$0</span></span>
        ${dest || `<span class="amt">pick</span>`}
      </div>`;
    }).join("");

    panels += `<section class="bs-panel side" aria-label="${esc(t.owner)}">
      <div class="bs-panel-head">${avatarImg(t,"oav")}<span class="bs-h2">${esc(t.owner)}</span><span class="side-tot">$${t.total}${SHOW_CAP?` / ${CAP}`:``}</span></div>
      <div class="side-ctrls">
        <input class="bs-input" type="search" placeholder="Search players" aria-label="Search ${esc(t.owner)}'s players" data-searchrid="${rid}" value="${esc(ui.q||"")}">
        <select class="bs-select" data-filterrid="${rid}" aria-label="Filter ${esc(t.owner)}'s players by position">${fposOpts}</select>
      </div>
      <div class="picklist">
        ${playerRows || `<p class="empty">No matching players.</p>`}
        ${t.picks.length ? `<div class="list-head bs-micro">Future picks · $0</div>${pickRows}` : ""}
      </div>
    </section>`;
  }

  const panelsWrap = TRADE_TEAMS.length>=2 ? `<div class="trade-panels">${panels}</div>` : "";
  el.innerHTML = capExplainer() + chips + panelsWrap + `<div id="tradeResult"></div>`;
  wireTrade(el);
  restoreFocus(el, fk);
  renderTradeResult();
}

function wireTrade(el){
  // toggle teams in/out of the trade
  el.querySelectorAll("[data-tteam]").forEach(chip => chip.addEventListener("click", () => {
    const rid = Number(chip.dataset.tteam);
    HASH_NOTE = "";
    if(TRADE_TEAMS.includes(rid)){
      TRADE_TEAMS = TRADE_TEAMS.filter(x => x !== rid);
      // drop any assets from/to this team
      for(const [k,a] of [...TRADE_ASSETS]) if(a.fromRid===rid || a.toRid===rid) TRADE_ASSETS.delete(k);
    } else {
      if(TRADE_TEAMS.length >= 10) return; // cap at 10 teams (whole league)
      TRADE_TEAMS.push(rid);
    }
    // any asset whose destination is no longer a valid team gets its dest reset
    reconcileDestinations();
    paintTrade();
  }));
  // search / filter within a team
  el.querySelectorAll("input[data-searchrid]").forEach(inp => inp.addEventListener("input", e => {
    const rid = Number(e.target.dataset.searchrid); TRADE_UI[rid].q = e.target.value;
    const caret = e.target.selectionStart; paintTrade();
    const again = document.querySelector(`input[data-searchrid="${rid}"]`);
    if(again){ again.focus(); try{ again.setSelectionRange(caret,caret); }catch(_){} }
  }));
  el.querySelectorAll("select[data-filterrid]").forEach(sel => sel.addEventListener("change", e => {
    TRADE_UI[Number(e.target.dataset.filterrid)].fpos = e.target.value; paintTrade();
  }));
  // check/uncheck an asset
  el.querySelectorAll("input[data-asset]").forEach(cb => cb.addEventListener("change", e => {
    const rid = Number(e.target.dataset.rid);
    const others = TRADE_TEAMS.filter(x => x !== rid);
    const defaultTo = others.length ? others[0] : null;
    HASH_NOTE = "";
    if(e.target.dataset.asset === "player"){
      const pid = e.target.dataset.pid, key = assetKindKey("p", pid);
      const t = teamByRid(rid); const p = t.players.find(x => x.pid===pid);
      if(e.target.checked) TRADE_ASSETS.set(key, { fromRid:rid, toRid:defaultTo, kind:"player", amt:p?p.amt:0, label:p?p.name:pid });
      else TRADE_ASSETS.delete(key);
    } else {
      const ykey = e.target.dataset.pickkey, key = `k:${rid}:${ykey}`;
      const t = teamByRid(rid); const pk = t.picks.find(x => x.ykey===ykey);
      if(e.target.checked) TRADE_ASSETS.set(key, { fromRid:rid, toRid:defaultTo, kind:"pick", amt:0, label:pk?pk.label:ykey });
      else TRADE_ASSETS.delete(key);
    }
    paintTrade();
  }));
  // change an asset's destination
  el.querySelectorAll("select.dest").forEach(sel => sel.addEventListener("change", e => {
    const key = e.target.dataset.destfor; const a = TRADE_ASSETS.get(key);
    if(a){ a.toRid = Number(e.target.value); renderTradeResult(); }
  }));
}

// if a destination team left the trade, point the asset at the first available other team
function reconcileDestinations(){
  for(const [k,a] of TRADE_ASSETS){
    const others = TRADE_TEAMS.filter(x => x !== a.fromRid);
    if(!TRADE_TEAMS.includes(a.fromRid)){ TRADE_ASSETS.delete(k); continue; }
    const source = teamByRid(a.fromRid);
    const asset = a.kind === "player"
      ? source.players.find(p => assetKindKey("p", p.pid) === k)
      : source.picks.find(p => `k:${source.roster_id}:${p.ykey}` === k);
    if(!asset){ TRADE_ASSETS.delete(k); continue; }
    a.amt = a.kind === "player" ? asset.amt : 0;
    a.label = a.kind === "player" ? asset.name : asset.label;
    if(a.toRid==null || !others.includes(a.toRid)) a.toRid = others.length ? others[0] : null;
  }
}

function renderTradeResult(){ try { renderTradeResultInner(); } finally { writeHash(); } }
function renderTradeResultInner(){
  const box = document.getElementById("tradeResult"); if(!box) return;
  if(!DATA_READY){ box.innerHTML = `<p class="empty" role="status">Trade cap results unavailable until a complete refresh succeeds.</p>`; return; }
  const teams = tradeTeamObjects();
  if(teams.length < 2){ box.innerHTML = `<p class="empty">Add at least two teams to build a trade.</p>`; return; }

  // per-team salary in/out (picks are $0 so they don't move the total)
  const out = {}, inc = {}, movingPicks = {};
  teams.forEach(t => { out[t.roster_id]=0; inc[t.roster_id]=0; movingPicks[t.roster_id]={in:0,out:0}; });
  let anyAsset = false;
  for(const a of TRADE_ASSETS.values()){
    if(a.toRid==null) continue;
    anyAsset = true;
    if(a.kind === "player"){ out[a.fromRid]+=a.amt; inc[a.toRid]+=a.amt; }
    else { movingPicks[a.fromRid].out++; movingPicks[a.toRid].in++; }
  }

  const pk = n => n ? `<span class="bs-dim"> · ${n} pick${n===1?"":"s"}</span>` : "";
  const rowsHtml = teams.map(t => {
    const o = out[t.roster_id]||0, i = inc[t.roster_id]||0;
    const proj = t.total - o + i;
    const room = CAP - proj, over = SHOW_CAP && proj > CAP;
    const mp = movingPicks[t.roster_id];
    return `<tr>
      <td>${esc(t.owner)}</td>
      <td class="num">$${t.total}</td>
      <td class="num">-$${o}${pk(mp.out)}</td>
      <td class="num">+$${i}${pk(mp.in)}</td>
      <td class="num${over?" bs-down":""}">$${proj}</td>
      ${SHOW_CAP?`<td class="num"><span class="${room<0?"bs-down":"bs-up"}">${room<0?`$${Math.abs(room)} over`:`$${room}`}</span></td>`:""}
    </tr>`;
  }).join("");
  const table = `<div class="bs-panel"><div class="bs-table-wrap"><table class="bs-table bs-table--stick1">
    <thead><tr><th>Team</th><th class="num">Now</th><th class="num">Out</th><th class="num">In</th><th class="num">After</th>${SHOW_CAP?`<th class="num">Room</th>`:""}</tr></thead>
    <tbody>${rowsHtml}</tbody></table></div></div>`;

  // verdict only when cap display is ON
  let verdict = "";
  if(SHOW_CAP && anyAsset){
    const overTeams = teams.filter(t => (t.total - (out[t.roster_id]||0) + (inc[t.roster_id]||0)) > CAP);
    verdict = overTeams.length
      ? `<p class="verdict bs-down">Over cap: ${overTeams.map(t=>esc(t.owner)).join(", ")}</p>`
      : `<p class="verdict bs-up">All teams under $${CAP}</p>`;
  }

  // ---- screenshot-ready summary (display only; reuses the salaries already computed) ----
  let summaryHtml = "";
  if(anyAsset){
    // per-team gives/gets lists from the trade assets
    const gives = {}, gets = {}; teams.forEach(t => { gives[t.roster_id]=[]; gets[t.roster_id]=[]; });
    for(const a of TRADE_ASSETS.values()){
      if(a.toRid==null) continue;
      const item = { label:a.label, amt:(a.kind==="pick"?0:a.amt), pick:a.kind==="pick" };
      if(gives[a.fromRid]) gives[a.fromRid].push(item);
      if(gets[a.toRid]) gets[a.toRid].push(item);
    }
    const dateStr = new Date().toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
    const assetLine = it => `<span>${esc(it.label)}</span> <span class="ts-amt">$${it.amt}</span>`;
    const sumOf = arr => arr.reduce((s,x)=>s+x.amt,0);

    const teamBlocks = teams.map(t => {
      const g = gives[t.roster_id]||[], r = gets[t.roster_id]||[];
      const o = sumOf(g), i = sumOf(r);
      const proj = t.total - o + i, room = CAP - proj, over = SHOW_CAP && proj > CAP;
      const list = (arr, empty) => arr.length
        ? `<ul class="ts-list">${arr.map(it=>`<li>${assetLine(it)}</li>`).join("")}</ul><div class="ts-sub">= $${sumOf(arr)}</div>`
        : `<div class="ts-none">${empty}</div>`;
      const afterBits = SHOW_CAP
        ? `$${t.total} → <b class="${over?'ts-over':''}">$${proj}</b> / ${CAP} · ${room<0?`<b class="ts-over">$${Math.abs(room)} over</b>`:`$${room} room`}`
        : `$${t.total} → <b>$${proj}</b>`;
      return `<div class="ts-team">
        <div class="ts-tname">${avatarImg(t,"ts-av")}${esc(t.owner)}</div>
        <div class="ts-cols">
          <div class="ts-col"><div class="bs-micro gives">Gives</div>${list(g,"—")}</div>
          <div class="ts-col"><div class="bs-micro gets">Gets</div>${list(r,"—")}</div>
        </div>
        <div class="ts-after">${afterBits}</div>
      </div>`;
    }).join("");

    let vLine = "";
    if(SHOW_CAP){
      const overTeams = teams.filter(t => (t.total - sumOf(gives[t.roster_id]||[]) + sumOf(gets[t.roster_id]||[])) > CAP);
      vLine = overTeams.length
        ? `<p class="ts-verdict bs-down">${overTeams.map(t=>esc(t.owner)).join(", ")} over $${CAP}</p>`
        : `<p class="ts-verdict bs-up">All teams under $${CAP}</p>`;
    }

    summaryHtml = `<section class="bs-panel ts-card" id="tradeSummary" aria-label="Trade summary">
      <div class="bs-panel-head ts-head"><span class="ts-title">Busch Apple Trade</span><span class="ts-date">${esc(dateStr)}</span></div>
      <div class="ts-teams">${teamBlocks}</div>
      ${vLine}
      <p class="ts-foot">Calculated salaries · picks $0${SHOW_CAP?` · cap $${CAP}`:""}. Cap check only; roster and contract rules are not checked.</p>
    </section>
    <div class="ts-actions"><button type="button" class="bs-btn" id="copyTradeBtn">Copy summary</button><button type="button" class="bs-btn" id="copyLinkBtn">Copy link</button><span class="copy-msg" id="copyMsg" role="status"></span></div>`;
  }

  box.innerHTML = `<div class="result">${table}${verdict}${summaryHtml}</div>`;

  // wire copy-to-clipboard (plain-text summary for chat, or the shareable link)
  const copyMsg = txt => { const m = document.getElementById("copyMsg"); if(m){ m.textContent = txt; if(txt === "Copied") setTimeout(()=>{ m.textContent=""; }, 1800); } };
  const copy = txt => (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
    .then(() => copyMsg("Copied")).catch(() => copyMsg("Copy failed — long-press to select."));
  const copyBtn = document.getElementById("copyTradeBtn");
  if(copyBtn) copyBtn.addEventListener("click", () => copy(buildTradeText(teams, out, inc)));
  const linkBtn = document.getElementById("copyLinkBtn");
  if(linkBtn) linkBtn.addEventListener("click", () => copy(location.href));
}

// plain-text trade summary for the clipboard (mirrors the visual summary)
function buildTradeText(teams){
  if(!DATA_READY) return "Trade cap results unavailable until a complete refresh succeeds.";
  const gives = {}, gets = {}; teams.forEach(t => { gives[t.roster_id]=[]; gets[t.roster_id]=[]; });
  for(const a of TRADE_ASSETS.values()){
    if(a.toRid==null) continue;
    const item = { label:a.label, amt:(a.kind==="pick"?0:a.amt) };
    if(gives[a.fromRid]) gives[a.fromRid].push(item);
    if(gets[a.toRid]) gets[a.toRid].push(item);
  }
  const sumOf = arr => arr.reduce((s,x)=>s+x.amt,0);
  const dateStr = new Date().toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
  const lines = [`Busch Apple Trade — ${dateStr}`, ""];
  let anyOver = false;
  teams.forEach(t => {
    const g = gives[t.roster_id]||[], r = gets[t.roster_id]||[];
    const o = sumOf(g), i = sumOf(r), proj = t.total - o + i;
    if(SHOW_CAP && proj > CAP) anyOver = true;
    lines.push(t.owner);
    lines.push(`  Gives: ${g.length? g.map(x=>`${x.label} $${x.amt}`).join(", ")+` (=$${o})` : "—"}`);
    lines.push(`  Gets:  ${r.length? r.map(x=>`${x.label} $${x.amt}`).join(", ")+` (=$${i})` : "—"}`);
    lines.push(SHOW_CAP ? `  Total: $${t.total} -> $${proj} / ${CAP} (${CAP-proj<0?`$${proj-CAP} OVER`:`$${CAP-proj} room`})`
                        : `  Total: $${t.total} -> $${proj}`);
    lines.push("");
  });
  if(SHOW_CAP) lines.push(anyOver ? `Result: OVER CAP` : `Result: all teams under $${CAP}`);
  lines.push("Cap check only; roster and contract rules are not checked.");
  return lines.join("\n").trim();
}

/* ============================ URL-HASH STATE ============================ */
// #grid[/table|cards|chart][/<rid>][/color-owner|color-none] · #teams[/all|/3.7.9] · #trade[/3.7[/p4046~7,k2027-1-3~3]]
// From-team ownership is always derived from live rosters, never trusted from the URL.
function applyHash(raw){
  let h = String(raw || "").replace(/^#/, "");
  try{ h = decodeURIComponent(h); }catch(e){}
  const seg = h.split("/");
  const tab = PANE[(seg[0]||"").toLowerCase()] ? seg[0].toLowerCase() : "grid";
  const rest = h.length > 1500 ? [] : seg.slice(1);
  const ridOk = s => /^\d{1,2}$/.test(s) && !!teamByRid(Number(s));
  if(tab === "grid"){
    for(const s0 of rest){ const s = s0.toLowerCase();
      if(s === "table" || s === "cards" || s === "chart") GRID_VIEW = s;
      else if(/^color-(both|position|owner|none)$/.test(s)) GRID_COLOR = s.slice(6);
      else if(ridOk(s)) GRID_CHART_TEAM = Number(s);
    }
  } else if(tab === "teams" && TEAMS.length){
    const s = (rest[0] || "").toLowerCase();
    SELECTED.clear();
    if(s === "all") SELECTED.add("__ALL__");
    else s.split(".").filter(ridOk).map(Number).forEach(id => { if(SELECTED.size < 4) SELECTED.add(id); });
  } else if(tab === "trade" && TEAMS.length){
    const ids = [];
    (rest[0] || "").split(".").filter(ridOk).map(Number).forEach(id => { if(!ids.includes(id) && ids.length < 10) ids.push(id); });
    TRADE_TEAMS = ids;
    TRADE_ASSETS.clear();
    let dropped = 0, droppedPicks = 0;
    for(const tok of (rest[1] || "").split(",").filter(Boolean)){
      let m;
      if((m = /^p([0-9A-Za-z]{1,8})~(\d{1,2})$/.exec(tok))){
        const pid = m[1], toRid = Number(m[2]);
        const from = TEAMS.find(t => t.players.some(p => p.pid === pid));
        if(!from || !TRADE_TEAMS.includes(from.roster_id)){ dropped++; continue; }
        const p = from.players.find(x => x.pid === pid);
        TRADE_ASSETS.set(assetKindKey("p", pid), { fromRid:from.roster_id, toRid, kind:"player", amt:p.amt, label:p.name });
      } else if((m = /^k(\d{4}-[1-3]-\d{1,2})~(\d{1,2})$/.exec(tok))){
        const ykey = m[1], toRid = Number(m[2]);
        const from = TEAMS.find(t => t.picks.some(pk => pk.ykey === ykey));
        if(!from || !TRADE_TEAMS.includes(from.roster_id)){ dropped++; droppedPicks++; continue; }
        const pk = from.picks.find(x => x.ykey === ykey);
        TRADE_ASSETS.set(`k:${from.roster_id}:${ykey}`, { fromRid:from.roster_id, toRid, kind:"pick", amt:0, label:pk.label });
      }   // any other token is malformed: dropped silently
    }
    reconcileDestinations();   // resets a to-team that is not in the trade or equals the from-team
    const noun = droppedPicks === dropped ? "pick" : droppedPicks ? "asset" : "player";
    HASH_NOTE = dropped ? `${dropped} ${noun}${dropped===1?"":"s"} from the link ${dropped===1?"is":"are"} no longer on that roster.` : "";
  }
  selectTab(tab);
}
function hashString(){
  if(ACTIVE_TAB === "teams"){
    if(SELECTED.has("__ALL__")) return "teams/all";
    return SELECTED.size ? "teams/" + [...SELECTED].join(".") : "teams";
  }
  if(ACTIVE_TAB === "trade"){
    if(!TRADE_TEAMS.length) return "trade";
    const toks = [];
    for(const [k,a] of TRADE_ASSETS){
      if(a.toRid == null) continue;
      toks.push(a.kind === "player" ? `p${k.slice(2)}~${a.toRid}` : `k${k.split(":")[2]}~${a.toRid}`);
    }
    return "trade/" + TRADE_TEAMS.join(".") + (toks.length ? "/" + toks.join(",") : "");
  }
  let h = "grid/" + GRID_VIEW;
  if(GRID_VIEW === "chart"){ if(GRID_CHART_TEAM != null) h += "/" + GRID_CHART_TEAM; }
  else if(GRID_COLOR !== "both") h += "/color-" + GRID_COLOR;
  return h;
}
function writeHash(){
  try{
    if(!TEAMS.length && HASH_PENDING) return;      // keep a shared-link hash until the first load applies it
    const h = hashString();
    if(location.hash.replace(/^#/, "") !== h) history.replaceState(null, "", "#" + h);
    LAST_HASH = h;
  }catch(e){}
}

/* ============================ TABS ============================ */
// tablist: the #tabs element (ARIA tablist); onSelect(key) paints + writes the hash. Buttons carry data-key.
function wireTabs(tablist, onSelect){
  const tabs=[...tablist.querySelectorAll('[role="tab"]')];
  tabs.forEach((t,i)=>{
    t.addEventListener("click",()=>onSelect(t.dataset.key));
    t.addEventListener("keydown",e=>{ let j=null;
      if(e.key==="ArrowRight") j=(i+1)%tabs.length; else if(e.key==="ArrowLeft") j=(i-1+tabs.length)%tabs.length;
      else if(e.key==="Home") j=0; else if(e.key==="End") j=tabs.length-1;
      if(j!==null){ e.preventDefault(); tabs[j].focus(); onSelect(tabs[j].dataset.key); } });
  });
}
function setSelectedTab(tablist, key){ tablist.querySelectorAll('[role="tab"]').forEach(t=>{ const on=t.dataset.key===key;
  t.setAttribute("aria-selected", on?"true":"false"); t.tabIndex = on?0:-1; }); }
const TABLIST = document.getElementById("tabs");
function selectTab(key){
  if(!PANE[key]) key = "grid";
  ACTIVE_TAB = key;
  for(const k in PANE) document.getElementById("pane-" + PANE[k]).classList.toggle("hide", k !== key);
  setSelectedTab(TABLIST, key);
  writeHash();
}
wireTabs(TABLIST, selectTab);

// ---- load + paint ----
const START_HASH = location.hash.replace(/^#/, "");
async function load(){
  if(LOADING) return;
  LOADING = true; DATA_READY = false;
  renderTradeResult();
  const status = document.getElementById("status");
  const errbox = document.getElementById("errbox");
  errbox.innerHTML = ""; status.textContent = "Sleeper · loading…";
  try{
    TEAMS = await buildSalaries();
    // reconcile trade against fresh data
    TRADE_TEAMS = TRADE_TEAMS.filter(rid => teamByRid(rid));
    for(const [k,a] of [...TRADE_ASSETS]) if(!teamByRid(a.fromRid)) TRADE_ASSETS.delete(k);
    reconcileDestinations();
    if(HASH_PENDING){ applyHash(START_HASH); HASH_PENDING = false; }   // first successful load: resolve link ids
    DATA_READY = true;
    document.getElementById("sub").textContent = `Salary & trade tool · ${TEAMS.length} teams · ${SEASON}${SHOW_CAP?` · cap $${CAP}`:""}`;
    paintTable(); paintGrid(); paintTrade();
    status.textContent = `Sleeper · updated ${new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}`;
  }catch(e){
    DATA_READY = false;
    errbox.innerHTML = `<div class="err" role="alert">Couldn't load: ${esc(e.message)}. Try Refresh.</div>`;
    status.textContent = "Sleeper · couldn't update";
    renderTradeResult();
  }finally{
    LOADING = false;
  }
}

document.getElementById("refreshBtn").addEventListener("click", load);
document.getElementById("autoRefresh").addEventListener("change", e => {
  if(e.target.checked){ AUTO = setInterval(load, 60000); } else { clearInterval(AUTO); AUTO = null; }
});
window.addEventListener("hashchange", () => {
  const h = location.hash.replace(/^#/, "");
  if(h === LAST_HASH) return;
  applyHash(h);
  if(TEAMS.length){ paintTable(); paintGrid(); paintTrade(); }
});

// ---- theme: System -> Light -> Dark (localStorage "bs-theme") ----
// theme-color metas follow the OS via media=; a manual choice overrides both so the browser chrome matches (review N7).
const TC_META=[...document.querySelectorAll('meta[name="theme-color"]')], TC_ORIG=TC_META.map(x=>x.content), TC_BG={light:"#F5F6F8",dark:"#0E1116"};
function applyTheme(m){ const r=document.documentElement; if(m==="light"||m==="dark") r.setAttribute("data-theme",m); else r.removeAttribute("data-theme");
  TC_META.forEach((x,i)=>{ x.content = TC_BG[m] || TC_ORIG[i]; });
  try{ m==="system"?localStorage.removeItem("bs-theme"):localStorage.setItem("bs-theme",m); }catch(e){}
  const b=document.getElementById("themeBtn"); if(b){ b.textContent="Theme: "+m[0].toUpperCase()+m.slice(1); b.setAttribute("aria-label","Color theme: "+m+". Activate to change."); } }
function currentTheme(){ return document.documentElement.getAttribute("data-theme")||"system"; }
document.getElementById("themeBtn").addEventListener("click",()=>{ const o=["system","light","dark"]; applyTheme(o[(o.indexOf(currentTheme())+1)%3]); });
applyTheme(currentTheme());

// start-up: apply the tab / grid view / color from a link now; ids that need TEAMS resolve on the first load
HASH_PENDING = !!START_HASH;
applyHash(START_HASH);

load();
</script>
